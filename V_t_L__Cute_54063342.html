<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Vật Lý Cute</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--b1:#ffe3f1;--b2:#dfeaff;--card:rgba(255,255,255,.66);--tx:#34304a;--mu:#7a7694;--ac:#ff6fae;--ac2:#6f9bff;--bd:rgba(255,255,255,.9);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#2a1c3a;--b2:#17213a;--card:rgba(255,255,255,.08);--tx:#f1eeff;--mu:#b2accb;--bd:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--b1:#2a1c3a;--b2:#17213a;--card:rgba(255,255,255,.08);--tx:#f1eeff;--mu:#b2accb;--bd:rgba(255,255,255,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--b1),var(--b2)) fixed;min-height:100vh}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--card);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
nav a{white-space:nowrap;padding:7px 13px;border-radius:99px;color:var(--tx);text-decoration:none;transition:.2s}nav a:hover{transform:translateY(-2px)}nav a.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}
main{max-width:1000px;margin:auto;padding:14px}h2{margin:.2em 0 .6em}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 6px 24px rgba(120,100,180,.12);animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit;color:var(--tx);border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:7px 12px}
button{cursor:pointer;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;transition:.15s}button:hover{transform:scale(1.04)}button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
input[type=range]{padding:0;width:100%}textarea{width:100%;min-height:80px}canvas{width:100%;border-radius:14px;background:var(--card);display:block}
.mu{color:var(--mu);font-size:13px}.big{font-size:28px;font-weight:700}.ok{color:#1fb37a}.no{color:#e5484d}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:left}.sc{overflow-x:auto}
.bar{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2))}.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:12px}
</style></head><body><nav id="nav"></nav><main id="app"></main>
<script src="/assets/aistudio/subject-ai-bridge.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tex=s=>{try{return katex.renderToString(s,{output:'mathml',throwOnError:false})}catch(e){return esc(s)}};
const rich=s=>String(s??'').split(/\$(.+?)\$/g).map((p,i)=>i%2?tex(p):esc(p)).join('');
const seed={name:'Bạn',hist:[],q:[
{id:1,topic:'Động học',level:1,type:'mcq',q:'Xe chạy đều 72 km/h. Vận tốc theo m/s?',o:['10','20','30','72'],a:'B',sol:'72 : 3,6 = 20 m/s'},
{id:2,topic:'Động học',level:2,type:'num',q:'Vật rơi tự do từ nghỉ trong 3 s (g = 10 m/s²). Quãng đường rơi (m)?',a:'45',sol:'s = ½gt² = ½·10·9 = 45 m'},
{id:3,topic:'Động lực học',level:1,type:'num',q:'Lực 10 N tác dụng lên vật 2 kg. Gia tốc (m/s²)?',a:'5',sol:'a = F/m = 10/2 = 5 m/s²'}],
th:[{grade:'10',topic:'Động học',title:'Chuyển động thẳng biến đổi đều',body:'Gia tốc không đổi. $v=v_0+at$, $s=v_0t+\\frac{1}{2}at^2$, $v^2-v_0^2=2as$.'},
{grade:'10',topic:'Động lực học',title:'Định luật II Newton',body:'Gia tốc tỉ lệ thuận với hợp lực, tỉ lệ nghịch với khối lượng: $\\vec a=\\vec F/m$.'}],
fm:[{topic:'Động học',name:'Vận tốc',tex:'v=v_0+at',sym:'v: vận tốc (m/s); a: gia tốc (m/s²); t: thời gian (s)',ex:'v0=2, a=3, t=4 → v=14 m/s'},
{topic:'Điện',name:'Định luật Ôm',tex:'I=\\frac{U}{R}',sym:'I (A); U (V); R (Ω)',ex:'U=12, R=4 → I=3 A'},
{topic:'Dao động',name:'Chu kỳ con lắc lò xo',tex:'T=2\\pi\\sqrt{\\frac{m}{k}}',sym:'m (kg); k (N/m)',ex:'m=1, k=100 → T≈0,63 s'}]};
let D;try{D=JSON.parse(localStorage.getItem('phy1'))}catch(e){}D=D||seed;const save=()=>{try{localStorage.setItem('phy1',JSON.stringify(D))}catch(e){}};
const nid=()=>Date.now()+Math.random();
/* ---- plot ---- */
const COL=['#ff5fa2','#5b8cff','#2fc79a'];
function plot(cv,rows,names=[]){const cw=cv.clientWidth,ch=cv.clientHeight;if(cv.width!==cw)cv.width=cw;if(cv.height!==ch)cv.height=ch;const W=cv.width,H=cv.height,c=cv.getContext('2d');c.clearRect(0,0,W,H);if(rows.length<2)return;const n=rows[0].length-1;let a=1e18,b=-1e18,x0=rows[0][0],x1=rows[0][0];for(const r of rows){x0=Math.min(x0,r[0]);x1=Math.max(x1,r[0]);for(let k=1;k<=n;k++)if(isFinite(r[k])){a=Math.min(a,r[k]);b=Math.max(b,r[k])}}
if(a===b){a-=1;b+=1}if(x0===x1)x1+=1;const p=36,X=x=>p+(x-x0)/(x1-x0)*(W-p-8),Y=y=>H-18-(y-a)/(b-a)*(H-30);c.strokeStyle='#9996';c.fillStyle='#999';c.font='11px sans-serif';
c.beginPath();c.moveTo(p,Y(a));c.lineTo(p,Y(b));if(a<0&&b>0){c.moveTo(p,Y(0));c.lineTo(W,Y(0))}else{c.moveTo(p,Y(a));c.lineTo(W,Y(a))}c.stroke();
[a,b].forEach(v=>c.fillText(+v.toPrecision(3),0,Y(v)+4));[x0,x1].forEach((v,i)=>c.fillText(+v.toPrecision(3),i?W-30:p,H-4));
for(let k=1;k<=n;k++){c.strokeStyle=c.fillStyle=COL[k-1];c.lineWidth=2;c.beginPath();let st=0;rows.forEach(r=>{if(!isFinite(r[k])){st=0;return}st?c.lineTo(X(r[0]),Y(r[k])):c.moveTo(X(r[0]),Y(r[k]));st=1});c.stroke();if(rows.length<80&&k==1)rows.forEach(r=>{c.beginPath();c.arc(X(r[0]),Y(r[k]),3,0,7);c.fill()});if(names[k-1])c.fillText(names[k-1],p+8+(k-1)*70,12)}}
/* ---- importer ---- */
const COLS={q:['topic','level','type','question','a','b','c','d','answer','solution'],th:['grade','topic','title','content'],fm:['topic','name','formula','symbols','example']};
const MAP={q:r=>{const o=[r.a,r.b,r.c,r.d].filter(x=>x!==undefined&&x!=='').map(String),m=o.length>1&&!/^n/i.test(r.type||'');return{id:nid(),topic:r.topic||'Khác',level:+r.level||1,type:m?'mcq':'num',q:String(r.question||''),o:m?o:undefined,a:m?String(r.answer).trim().toUpperCase():String(r.answer).replace(',','.'),sol:String(r.solution||'')}},
th:r=>({grade:String(r.grade||''),topic:r.topic||'Khác',title:r.title||'',body:String(r.content||'')}),fm:r=>({topic:r.topic||'Khác',name:r.name||'',tex:r.formula||'',sym:r.symbols||'',ex:r.example||''})};
const KEY={q:'q',th:'th',fm:'fm'};
function importer(t,after){const d=document.createElement('div');d.className='card';const tpl=COLS[t].join('\t');d.innerHTML=`<div class="r"><b>📥 Nhập Excel</b><input type="file" accept=".xlsx,.xls" class="f"><button class="s cp">Sao chép mẫu cột</button></div><div class="mu">Hàng đầu là tên cột: ${COLS[t].join(', ')}${t=='q'?' (type: mcq hoặc num; đáp án mcq là A–D)':''}. Công thức dùng cú pháp LaTeX.</div><div class="pv"></div>`;
d.querySelector('.cp').onclick=async()=>{try{await navigator.clipboard.writeText(tpl);alert('Đã sao chép. Dán vào Excel.')}catch(e){prompt('Sao chép dòng này rồi dán vào Excel:',tpl)}};
d.querySelector('.f').onchange=async e=>{const f=e.target.files[0];if(!f)return;let rows;try{const wb=XLSX.read(await f.arrayBuffer());rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}).map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k.trim().toLowerCase(),v])))}catch(x){d.querySelector('.pv').textContent='Không đọc được file.';return}
rows=rows.filter(r=>Object.values(r).some(v=>v!==''));const pv=d.querySelector('.pv');if(!rows.length){pv.textContent='File trống.';return}
pv.innerHTML=`<p>${rows.length} dòng (sửa trực tiếp trong bảng, hiển thị 30 dòng đầu):</p><div class="sc"><table><tr>${COLS[t].map(c=>`<th>${c}</th>`).join('')}</tr>${rows.slice(0,30).map((r,i)=>`<tr>${COLS[t].map(c=>`<td contenteditable data-i="${i}" data-k="${c}">${esc(r[c])}</td>`).join('')}</tr>`).join('')}</table></div><button class="ok2">✅ Xác nhận lưu</button>`;
pv.querySelectorAll('td').forEach(td=>td.oninput=()=>rows[td.dataset.i][td.dataset.k]=td.textContent);
pv.querySelector('.ok2').onclick=()=>{const bad=t=='q'?rows.filter(r=>!r.question||r.answer==='').length:0;if(bad&&!confirm(bad+' dòng thiếu câu hỏi/đáp án sẽ bị bỏ qua. Tiếp tục?'))return;const add=rows.filter(r=>t!='q'||(r.question&&r.answer!=='')).map(MAP[t]);D[KEY[t]].push(...add);save();after()}};return d}
/* ---- pages ---- */
const PG={};
PG.home=h=>{const H=D.hist,n=H.length,ok=H.reduce((a,x)=>a+x.ok,0),tot=H.reduce((a,x)=>a+x.n,0),by={};H.forEach(x=>Object.entries(x.by).forEach(([k,[o,m]])=>{by[k]=by[k]||[0,0];by[k][0]+=o;by[k][1]+=m}));
h.innerHTML=`<h2>🌸 Tổng quan</h2><div class="g"><div class="card"><div class="mu">Lượt làm</div><div class="big">${n}</div></div><div class="card"><div class="mu">Độ chính xác</div><div class="big">${tot?Math.round(ok/tot*100):0}%</div></div><div class="card"><div class="mu">Điểm tích luỹ</div><div class="big">${H.reduce((a,x)=>a+x.pts,0)}</div></div><div class="card"><div class="mu">Kho dữ liệu</div><div>${D.q.length} bài · ${D.th.length} lý thuyết · ${D.fm.length} công thức</div></div></div>
<div class="card"><b>Theo chủ đề</b>${Object.entries(by).map(([k,[o,m]])=>`<div class="mu">${esc(k)} · ${o}/${m}</div><div class="bar" style="width:${o/m*100}%"></div>`).join('')||'<div class="mu">Chưa có dữ liệu. Hãy làm một bài Practice hoặc Test.</div>'}</div>
<div class="card"><b>Hoạt động gần đây</b>${H.slice(-6).reverse().map(x=>`<div>${x.mode} · ${x.ok}/${x.n} · ${new Date(x.d).toLocaleString('vi-VN')}</div>`).join('')||'<div class="mu">—</div>'}</div>`};
function filt(items,keys,h,render,t){const ctl=document.createElement('div');ctl.className='r card';ctl.innerHTML=keys.map(k=>`<select data-k="${k}"><option value="">${k}: tất cả</option>${[...new Set(items.map(x=>x[k]))].map(v=>`<option>${esc(v)}</option>`).join('')}</select>`).join('')+`<input class="qs" placeholder="Tìm…">`;const out=document.createElement('div');const up=()=>{let l=items.filter(x=>[...ctl.querySelectorAll('select')].every(s=>!s.value||String(x[s.dataset.k])===s.value));const s=ctl.querySelector('.qs').value.toLowerCase();if(s)l=l.filter(x=>JSON.stringify(x).toLowerCase().includes(s));out.innerHTML=l.map(render).join('')||'<div class="mu">Chưa có dữ liệu — hãy nhập Excel.</div>'};ctl.oninput=up;h.append(ctl,out);up()}
const PHY_PROMPTS={};
const phyBtn=(id,label,prompt)=>{PHY_PROMPTS[id]=prompt;return `<button class="s" onclick="phyExplainInline('${id}')">${label}</button>`};
const phyExplainInline=async(id,directPrompt)=>{const prompt=directPrompt||PHY_PROMPTS[id];const b=$('#'+id);if(!b||!prompt||!window.SchoolHubAI)return;b.style.display='block';b.innerHTML='<span class="mu">Gemini đang phân tích...</span>';try{await window.SchoolHubAI.streamAssist({subjectId:'physics',mode:'wrong_answer_coach',prompt,onDelta:(_d,full)=>{b.innerHTML=rich(full).replace(/\n/g,'<br>')}})}catch(e){b.innerHTML=`<span class="no">⚠ ${esc(e.message||'Không gọi được AI')}</span>`}};
const genPhyQAI=async(after)=>{if(!window.SchoolHubAI)return;const tp=$('#t')?.value||prompt('Nhập chủ đề Vật Lý muốn sinh câu hỏi AI (vd: Động học, Định luật Newton, Điện học, Dao động cơ):','Động học & Định luật Newton');if(!tp)return;const btn=$('#gen_phy_q');if(btn){btn.disabled=true;btn.textContent='⏳ Đang tạo...'}try{const res=await window.SchoolHubAI.generateQuiz({subjectId:'physics',topic:tp,count:4});const qs=Array.isArray(res.questions)?res.questions:[];if(!qs.length)return alert('AI chưa tạo được câu hỏi.');qs.forEach(q=>D.q.unshift({id:nid(),topic:tp,level:2,type:'mcq',q:q.question,o:q.options||[],a:'ABCD'[Number(q.correctIndex)||0]||'A',sol:q.explanation||''}));save();after&&after()}catch(e){alert('Lỗi AI: '+(e.message||'Không tạo được câu hỏi'))}finally{if(btn){btn.disabled=false;btn.textContent='✨ Sinh câu hỏi AI'}}};
PG.theory=h=>{h.innerHTML='<h2>📖 Lý thuyết</h2>';filt(D.th,['grade','topic'],h,(x,i)=>`<div class="card"><span class="tag">Lớp ${esc(x.grade)}</span> <span class="tag">${esc(x.topic)}</span><h3>${esc(x.title)}</h3><div>${rich(x.body)}</div><div style="margin-top:8px">${phyBtn('th_ai_'+i,'🤖 Giải thích với AI',`Giải thích bản chất vật lý, điều kiện áp dụng và cho 2 ví dụ tính toán thực tế cho: ${x.title} — ${x.body}`)}</div><div id="th_ai_${i}" class="card" style="display:none;margin-top:8px"></div></div>`);h.append(importer('th',()=>PG.theory(h)))};
PG.fm=h=>{h.innerHTML='<h2>🧮 Công thức</h2><div class="card"><b>Hằng số</b><div class="r">'+[['g','9{,}81\\ \\mathrm{m/s^2}'],['c','3\\times10^8\\ \\mathrm{m/s}'],['G','6{,}67\\times10^{-11}'],['h','6{,}63\\times10^{-34}\\ \\mathrm{J\\,s}'],['k_B','1{,}38\\times10^{-23}\\ \\mathrm{J/K}'],['e','1{,}6\\times10^{-19}\\ \\mathrm{C}']].map(([a,b])=>`<span class="tag">${tex(a+'='+b)}</span>`).join('')+'</div></div>';filt(D.fm,['topic'],h,(x,i)=>`<div class="card"><span class="tag">${esc(x.topic)}</span> <b>${esc(x.name)}</b><div class="big">${tex(x.tex)}</div><div class="mu">${rich(x.sym)}</div><div>Ví dụ: ${rich(x.ex)}</div><div style="margin-top:8px">${phyBtn('fm_ai_'+i,'🤖 AI phân tích công thức',`Giải thích đơn vị SI, ý nghĩa từng đại lượng và bẫy hay gặp khi dùng công thức: ${x.name} (${x.tex})`)}</div><div id="fm_ai_${i}" class="card" style="display:none;margin-top:8px"></div></div>`);h.append(importer('fm',()=>PG.fm(h)))};
PG.ex=h=>{h.innerHTML='<div class="r" style="justify-content:space-between"><h2>🧩 Bài tập</h2><button id="gen_phy_q" class="s">✨ Sinh câu hỏi AI</button></div>';$('#gen_phy_q').onclick=()=>genPhyQAI(()=>PG.ex(h));filt(D.q,['topic','level','type'],h,(x,i)=>`<div class="card"><span class="tag">${esc(x.topic)}</span> <span class="tag">Mức ${x.level}</span><p>${rich(x.q)}</p>${x.o?x.o.map((o,k)=>`<div>${'ABCD'[k]}. ${rich(o)}</div>`).join(''):''}<div class="r"><details style="flex:1"><summary>Đáp án & lời giải</summary><b>${esc(x.a)}</b><div>${rich(x.sol)}</div></details>${phyBtn('ex_ai_'+i,'🤖 AI giải từng bước',`Giải từng bước theo chuẩn SI bài Vật Lý: ${x.q}\nĐáp án đúng: ${x.a}`)}</div><div id="ex_ai_${i}" class="card" style="display:none;margin-top:8px"></div></div>`);h.append(importer('q',()=>PG.ex(h)))};
/* quiz (practice/test) */
function quiz(mode,h){h.innerHTML=`<h2>${mode=='test'?'⏱️ Kiểm tra':'✏️ Luyện tập'}</h2>`;const set=document.createElement('div');set.className='card r';const tp=[...new Set(D.q.map(x=>x.topic))];set.innerHTML=`<select id="t"><option value="">Mọi chủ đề</option>${tp.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="l"><option value="">Mọi mức</option><option>1</option><option>2</option><option>3</option></select><input id="n" type="number" min="1" value="5" style="width:70px" title="Số câu">${mode=='test'?'<input id="m" type="number" min="1" value="10" style="width:70px" title="Phút">':''}<button id="go">Bắt đầu</button>${mode!='test'?'<button id="gen_phy_q" class="s">✨ Sinh câu hỏi AI</button>':''}<span class="mu">${D.q.length} bài trong kho (Exercises)</span>`;const box=document.createElement('div');h.append(set,box);let tm;
if(set.querySelector('#gen_phy_q'))set.querySelector('#gen_phy_q').onclick=()=>genPhyQAI(()=>quiz(mode,h));
set.querySelector('#go').onclick=()=>{clearInterval(tm);let pool=D.q.filter(x=>(!$('#t').value||x.topic==$('#t').value)&&(!$('#l').value||x.level==$('#l').value)).sort(()=>Math.random()-.5).slice(0,+$('#n').value||5);if(!pool.length){box.innerHTML='<div class="card">Không có bài phù hợp. Nhập thêm ở mục Exercises.</div>';return}

 try{const image=f&&!simMode?await phyReadImg(f):null;
 const box=$('#phy_ai_out');let text='';
 if(window.SchoolHubAI){
  text=await window.SchoolHubAI.streamAssist({subjectId:'physics',mode:simMode?'similar_problems':'solve_step_by_step',prompt:q||(simMode?'Tạo 3 bài tập Vật Lý tương tự kèm đáp số chuẩn SI.':'Giải bài tập Vật Lý trong ảnh đính kèm.'),previousSolution:simMode?PHY_PREV:'',contextText:`Kho hiện có ${D.fm.length} công thức và ${D.th.length} chuyên đề lý thuyết.`,image,onDelta:(_d,full)=>{if(box)box.innerHTML=rich(full).replace(/\n/g,'<br>')}});
 }else{
  const res=await fetch('/api/ai/subject-assist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subjectId:'physics',mode:simMode?'similar_problems':'solve_step_by_step',prompt:q||(simMode?'Tạo 3 bài tập Vật Lý tương tự kèm đáp số chuẩn SI.':'Giải bài tập Vật Lý trong ảnh đính kèm.'),previousSolution:simMode?PHY_PREV:'',contextText:`Kho hiện có ${D.fm.length} công thức và ${D.th.length} chuyên đề lý thuyết.`,image})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){$('#out').innerHTML=`<div class="card no">⚠ ${esc(data.error||'Không thể kết nối trợ lý AI.')}</div>`;return}
  text=data.text||'';if(box)box.innerHTML=rich(text);
 }
 if(!simMode&&text)PHY_PREV=text;
 if(box)box.innerHTML=rich(text).replace(/\n/g,'<br>')}catch(e){$('#out').innerHTML=`<div class="card no">⚠ Lỗi kết nối: ${esc(e.message||'không gọi được AI')}</div>`}finally{PHY_BUSY=false;if($('#sv_ai'))$('#sv_ai').disabled=false;if($('#sm_ai'))$('#sm_ai').disabled=false}};
$('#sv_ai').onclick=()=>runAi(false);
$('#sm_ai').onclick=()=>runAi(true);
$('#sv').onclick=()=>{let tx=$('#in').value.replace(/(\d+(?:[.,]\d+)?)\s*km\/h/gi,(m,x)=>+(x.replace(',','.'))/3.6+' m/s ');const V={},st=[];let m;const re=/([A-Za-z][A-Za-z0-9]*)\s*[=:]\s*(-?\d+(?:\.\d+)?(?:e-?\d+)?)/g;const t2=tx.replace(/(\d),(\d)/g,'$1.$2');while(m=re.exec(t2)){let k=m[1];if(/^v[0o]$/i.test(k))k='v0';else if(k.length==2&&k[0]=='E')k='Ek';else if(!['Ek','v0'].includes(k))k=k.length==1&&'FUIRPWmsatvp'.includes(k.toLowerCase()&&k)?k:(k.toLowerCase()=='u'?'U':k.toLowerCase()=='i'?'I':k.toLowerCase()=='r'?'R':k);V[k]=+m[2]}
if(/rơi tự do/i.test(t2)){V.a??=9.8;V.v0??=0;st.push('Rơi tự do: lấy $a=g=9{,}8\\ \\mathrm{m/s^2}$, $v_0=0$')}
const tg=(t2.match(/tìm\s+([A-Za-z][A-Za-z0-9]*)/i)||[])[1];const T=tg?(/^v[0o]$/i.test(tg)?'v0':tg.length>1?tg:'FUIRPWmsatvp'.includes(tg)?tg:tg.toUpperCase()):null;
if(!Object.keys(V).length){$('#out').innerHTML='<div class="card">Chưa nhận ra dữ kiện dạng <b>tên = giá trị</b> để tính nhanh SI. Bạn có thể bấm <b>🤖 Giải bằng AI</b> để giải đề tự nhiên.</div>';return}
const given=Object.entries(V).map(([k,v])=>`${sub(k)}=${v}`).join(',\\ ');let prog=1,i=0;while(prog&&!(T&&T in V)&&i++<20){prog=0;for(const[o,n,f,eq]of RL){if(o in V||!n.every(k=>k in V))continue;const r=f(...n.map(k=>V[k]));if(!isFinite(r))continue;V[o]=r;st.push(`${tex(eq)} ⇒ ${tex(sub(o)+'='+(+r.toPrecision(5))+'\\ \\mathrm{'+UN[o].replace(/·/g,'\\cdot ').replace('²','^2')+'}')}`);prog=1;if(T&&o==T)break}}
const ans=T&&T in V?V[T]:null;let warn='';if(V.t<0||(V.m<=0)||(V.s<0&&!T))warn='⚠ Kết quả không hợp lý (đại lượng âm).';
$('#out').innerHTML=`<div class="card"><b>Dữ kiện:</b> ${tex(given)}<br><b>Yêu cầu:</b> ${T?esc(T):'(không nêu — liệt kê mọi đại lượng suy ra được)'}<ol>${st.map(x=>`<li>${x.startsWith('Rơi')?rich(x):x}</li>`).join('')||'<li class="mu">Không có công thức phù hợp với dữ kiện này.</li>'}</ol>${T&&ans===null?'<p class="no">Chưa đủ dữ kiện để tìm '+esc(T)+'.</p>':ans!==null?`<p class="big ok">${esc(T)} = ${+ans.toPrecision(5)} ${UN[T]||''}</p>`:''}<div class="no">${warn}</div><div class="mu">Đơn vị mặc định SI; kiểm tra đơn vị: mỗi bước dùng m, s, kg, N, V, A.</div></div>`}};
/* router */
const NAV=[['home','🏠 Home'],['theory','📖 Theory'],['ex','🧩 Exercises'],['prac','✏️ Practice'],['sim','🎈 Simulation'],['graph','📈 Graph'],['fm','🧮 Formula'],['ai','🤖 AI'],['test','⏱️ Test'],['rank','🏆 Ranking']];
$('#nav').innerHTML=NAV.map(([k,t])=>`<a href="#${k}" data-k="${k}">${t}</a>`).join('');
const emitPhyCtx=k=>{if(!window.SchoolHubAI)return;const names={home:'Tổng quan Vật Lý',theory:'Lý thuyết Vật Lý',ex:'Kho bài tập Vật Lý',prac:'Luyện tập Vật Lý',sim:'Mô phỏng Vật Lý',graph:'Đồ thị & Hồi quy',fm:'Công thức Vật Lý',ai:'Trợ lý AI Vật Lý',test:'Kiểm tra Vật Lý',rank:'Xếp hạng'};window.SchoolHubAI.emitContext({subjectId:'physics',view:k,topic:names[k]||k,summary:`${D.q.length} bài tập · ${D.th.length} lý thuyết · ${D.fm.length} công thức`})};
if(window.SchoolHubAI){window.SchoolHubAI.onHostCommand(msg=>{if(msg.type==='host:inject-quiz'&&msg.payload&&Array.isArray(msg.payload.questions)){msg.payload.questions.forEach(q=>D.q.unshift({id:nid(),topic:msg.payload.topic||'Vật Lý AI',level:2,type:'mcq',q:q.question,o:q.options||[],a:'ABCD'[Number(q.correctIndex)||0]||'A',sol:q.explanation||''}));save();location.hash='#ex'}else if(msg.type==='host:inject-cards'&&msg.payload&&Array.isArray(msg.payload.cards)){msg.payload.cards.forEach(c=>D.fm.unshift({topic:msg.payload.topic||'Vật Lý AI',name:c.front,tex:c.front,sym:c.back,ex:c.example||''}));save();location.hash='#fm'}})}
function route(){simTok++;const k=PG[location.hash.slice(1)]?location.hash.slice(1):'home';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));const m=$('#app');m.innerHTML='';PG[k](m);emitPhyCtx(k);window.scrollTo(0,0)}
