ai(el){el.innerHTML=`<div class=c><h2>🤖 Trợ lý AI Hóa Học</h2><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><select id=am>${[['solve_step_by_step','⚗️ Giải bài toán từng bước'],['tutor_chat','🧪 Cân bằng & Hiện tượng'],['similar_problems','📝 Tạo 3 bài tương tự']].map(([k,l])=>`<option value=${k} ${AI_MODE==k?'selected':''}>${l}</option>`).join('')}</select><input type=file id=aif accept="image/png,image/jpeg,image/webp,image/gif"></div><textarea id=aiq rows=4 style="width:100%" placeholder="Nhập bài toán Hóa học (mol, nồng độ, hiệu suất, cân bằng PTHH, pH...) hoặc tải ảnh đề bài...">${esc(AI_Q)}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button id=ais>🤖 Hỏi AI</button><button class=s id=aism>✨ Bài tương tự</button><button class=s id=aip1>Bài toán Fe + HCl</button><button class=s id=aip2>Cân bằng Cu + HNO3</button></div><div class=mu style="margin-top:6px">Tự động hiển thị chỉ số công thức hóa học (ví dụ H<sub>2</sub>O, CuSO<sub>4</sub>) và đọc được ảnh đề Hóa.</div></div><div id=aio></div>`;
$('#am').onchange=e=>AI_MODE=e.target.value;
$('#aip1').onclick=()=>{$('#aiq').value='Cho 5,6 g Fe tác dụng hoàn toàn với 200 mL dung dịch HCl 1,5M. Viết PTHH, tính thể tích khí H2 (đktc) và nồng độ mol các chất sau phản ứng.';$('#aiq').focus()};
$('#aip2').onclick=()=>{$('#aiq').value='Cân bằng phản ứng Cu + HNO3(loãng) → Cu(NO3)2 + NO + H2O theo thăng bằng electron và nêu hiện tượng quan sát được.';$('#aiq').focus()};
const runChemAi=async sim=>{if(AI_BUSY)return;const q=$('#aiq').value.trim(),f=$('#aif').files[0],o=$('#aio');
 if(!q&&!f&&!(sim&&AI_PREV)){o.innerHTML='<div class="c no">Hãy nhập câu hỏi Hóa học hoặc tải ảnh đề trước.</div>';return}
 AI_Q=q;AI_BUSY=true;$('#ais').disabled=true;$('#aism').disabled=true;
 o.innerHTML='<div class="c" id="chem_ai_out" style="white-space:pre-wrap;line-height:1.65"><span class=mu>Gemini đang phân tích phản ứng và tính số mol…</span></div>';
 try{const image=f&&!sim?await readChemImg(f):null;
 const box=$('#chem_ai_out');let text='';
 if(window.SchoolHubAI){
  text=await window.SchoolHubAI.streamAssist({subjectId:'chemistry',mode:sim?'similar_problems':AI_MODE,prompt:q||(sim?'Tạo 3 bài tập Hóa học tương tự kèm đáp số ngắn.':'Giải bài tập Hóa học trong ảnh đính kèm.'),previousSolution:sim?AI_PREV:'',contextText:`Ngân hàng ChemiLab có ${S.g('qs',QS0).length} câu hỏi và ${S.g('fm',FM0).length} công thức.`,image,onDelta:(_d,full)=>{if(box)box.innerHTML=chemRich(full).replace(/\n/g,'<br>')}});
 }else{
  const res=await fetch('/api/ai/subject-assist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subjectId:'chemistry',mode:sim?'similar_problems':AI_MODE,prompt:q||(sim?'Tạo 3 bài tập Hóa học tương tự kèm đáp số ngắn.':'Giải bài tập Hóa học trong ảnh đính kèm.'),previousSolution:sim?AI_PREV:'',contextText:`Ngân hàng ChemiLab có ${S.g('qs',QS0).length} câu hỏi và ${S.g('fm',FM0).length} công thức.`,image})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){o.innerHTML=`<div class="c no">⚠ ${esc(data.error||'Không gọi được trợ lý AI.')}</div>`;return}
  text=data.text||'';
 }
 if(!sim&&text)AI_PREV=text;
 if(box)box.innerHTML=chemRich(text).replace(/\n/g,'<br>');lg('Hỏi AI Hóa học')}catch(e){o.innerHTML=`<div class="c no">⚠ Lỗi kết nối: ${esc(e.message||'không gọi được AI')}</div>`}finally{AI_BUSY=false;if($('#ais'))$('#ais').disabled=false;if($('#aism'))$('#aism').disabled=false}};
$('#ais').onclick=()=>runChemAi(false);$('#aism').onclick=()=>runChemAi(true)},
rank(el){const T=[...st.tests].sort((a,b)=>b.p-a.p||a.s-b.s);el.innerHTML=`<div class=c>Tên hiển thị: <input id=nm value="${esc(st.name)}" placeholder="Tên của bạn"> <button id=sn>Lưu</button><p class=mu>Bảng xếp hạng lưu trên thiết bị này (chưa có máy chủ dùng chung).</p><div class=big>${st.xp} XP · Cấp ${Math.floor(st.xp/100)+1}</div></div><div class=c><b>Bảng điểm kiểm tra</b><table>${T.length?T.slice(0,15).map((t,i)=>`<tr><td>#${i+1}</td><td>${esc(t.n||'Bạn')}</td><td>${t.p}%</td><td>${t.s}s</td><td class=mu>${esc(t.d)}</td></tr>`).join(''):'<tr><td class=mu>Chưa có bài kiểm tra.</td></tr>'}</table></div>`;$('#sn').onclick=()=>{st.name=$('#nm').value;sv();go()}}};
function lib(el,key,seed,title,cols){const L=S.g(key,seed);el.innerHTML=`<div class=c><h2>${title}</h2><input id=sr placeholder="Tìm kiếm…" style="width:100%"></div><div id=ls></div><div class=c><b>Thêm mới</b><br><input id=t1 placeholder="Tiêu đề"> <input id=t2 placeholder="Nội dung / công thức"> <input id=t3 placeholder="Ghi chú"> <button id=ad>Thêm</button></div><div class=c id=im></div>`;
const sh=()=>{const q=$('#sr').value.toLowerCase();$('#ls').innerHTML=L.map((l,i)=>({l,i})).filter(o=>(o.l.t+o.l.c+o.l.n).toLowerCase().includes(q)).map(({l,i})=>`<div class=c><b>${fmt(l.t)}</b> <span class=mu>${esc(l.n||'')}</span> <button class=s data-d=${i} style="float:right">✕</button><div style="font-size:17px">${fmt(l.c)}</div></div>`).join('');el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{L.splice(b.dataset.d,1);S.s(key,L);sh()})};$('#sr').oninput=sh;sh();
$('#ad').onclick=()=>{if(!$('#t1').value)return;L.push({t:$('#t1').value,c:$('#t2').value,n:$('#t3').value});S.s(key,L);V[title=='Theory'?'theory':'formula'](el)};imp($('#im'),NL,rows=>S.s(key,[...L,...rows]),cols)}
function filt(qs){const cs=[...new Set(qs.map(q=>q.ch))];return`<select id=fc><option value="">Mọi chương</option>${cs.map(c=>`<option>${esc(c)}</option>`).join('')}</select> <select id=fl><option value="">Mọi mức</option><option>1</option><option>2</option><option>3</option></select>`}
function setup(el,mode){const qs=S.g('qs',QS0);el.innerHTML=`<div class=c><h2>${mode=='test'?'Kiểm tra':'Luyện tập'}</h2>${filt(qs)} Số câu <input id=nq type=number value=${Math.min(5,qs.length)} min=1 style="width:70px">${mode=='test'?' Phút <input id=mn type=number value=5 min=1 style="width:70px">':''} <button id=go>Bắt đầu</button>${mode!='test'?' <button id=btn_chem_aiq class=s>✨ Sinh câu hỏi AI</button>':''}<p class=mu>Lấy câu hỏi từ mục Exercises (${qs.length} câu).</p></div>`;
if($('#btn_chem_aiq'))$('#btn_chem_aiq').onclick=()=>genChemQAI(()=>setup(el,mode));
$('#go').onclick=()=>{const c=$('#fc').value,l=$('#fl').value;let ls=qs.filter(q=>(!c||q.ch==c)&&(!l||q.lv==l)).sort(()=>Math.random()-.5).slice(0,+$('#nq').value||5);if(!ls.length)return;run(el,mode,ls,mode=='test'?+$('#mn').value||5:0)}}
const nz=s=>String(s).toLowerCase().replace(/\s/g,'').replace(',','.');
function chk(Q,v){return Q.a.split('|').some(a=>{if(Q.o.length)return a.toUpperCase()==v;const p=parseFloat(nz(a)),u=parseFloat(nz(v));return!isNaN(p)&&!isNaN(u)&&nz(a)==String(p)?Math.abs(p-u)<=Math.max(.01*Math.abs(p),.01):nz(a)==nz(v)})}
function run(el,mode,ls,min){let i=0,rs=[];const end=Date.now()+min*6e4;
const fin=()=>{clearInterval(tm);const ok=rs.filter(r=>r.ok).length,p=Math.round(ok/ls.length*100),by={};rs.forEach(r=>{by[r.Q.ch]=by[r.Q.ch]||[0,0];by[r.Q.ch][1]++;if(r.ok)by[r.Q.ch][0]++});if(mode=='test'){st.tests.push({n:st.name,p,s:Math.round((Date.now()-end)/1e3+min*60),d:new Date().toLocaleDateString('vi')})}lg((mode=='test'?'Kiểm tra: ':'Luyện tập: ')+ok+'/'+ls.length);
const missed=rs.filter(r=>!r.ok);
el.innerHTML=`<div class=c><h2>Kết quả: ${ok}/${ls.length} (${p}%)</h2>${Object.entries(by).map(([k,v])=>`<div>${esc(k)}: ${v[0]}/${v[1]}</div>`).join('')}</div>${missed.map((r,idx)=>`<div class=c><b>${fmt(r.Q.q)}</b><div class=no>Bạn chọn: ${esc(r.v)||'—'}</div><div class=ok>Đáp án: ${fmt(r.Q.a)}</div><div class=mu>${fmt(r.Q.ex||'')}</div><div style="margin-top:6px"><button class=s data-fin-ai=${idx}>🤖 Giải thích với AI</button></div><div id=fin_ai_${idx} class=c style="display:none;margin-top:6px"></div></div>`).join('')}`;
el.querySelectorAll('[data-fin-ai]').forEach(b=>b.onclick=()=>{const r=missed[+b.dataset.finAi];if(r)chemStreamInline('fin_ai_'+b.dataset.finAi,`Giải thích lỗi sai và hướng dẫn làm đúng câu Hóa học:\n${r.Q.q}\nBạn chọn: ${r.v||'trống'}\nĐáp án đúng: ${r.Q.a}`)})};
const show=()=>{if(i>=ls.length)return fin();const Q=ls[i];el.innerHTML=`<div class=c><span class=mu>Câu ${i+1}/${ls.length} <b id=tt></b></span><h3>${fmt(Q.q)}</h3>${Q.o.length?Q.o.map((o,k)=>`<button class=s data-k=${'ABCD'[k]} style="display:block;width:100%;margin:6px 0;text-align:left">${'ABCD'[k]}. ${fmt(o)}</button>`).join(''):'<input id=in placeholder="Đáp án"> <button id=ok>OK</button>'}<div id=fb></div></div>`;
const ans=v=>{const ok=chk(Q,v);rs.push({Q,v,ok});st.ans++;if(ok){st.ok++;st.xp+=mode=='test'?5:10}sv();if(mode=='test'){i++;return show()}el.querySelectorAll('button').forEach(b=>b.disabled=true);const inp=$('#in');if(inp)inp.disabled=true;$('#fb').innerHTML=`<p class="${ok?'ok':'no'}">${ok?'✅ Đúng! +10 XP':'❌ Đáp án: '+fmt(Q.a)}</p><div class=mu>${fmt(Q.ex||'')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button id=nx>Tiếp →</button><button id=ex_q_ai class=s>🤖 Giải thích với AI</button></div><div id=fb_ai class=c style="display:none;margin-top:8px"></div>`;$('#nx').disabled=false;$('#ex_q_ai').disabled=false;$('#nx').onclick=()=>{i++;show()};$('#ex_q_ai').onclick=()=>chemStreamInline('fb_ai',`Giải thích rõ câu Hóa học sau:\n${Q.q}\nHọc sinh chọn: ${v}\nĐáp án đúng: ${Q.a}\nGhi chú: ${Q.ex||''}`)};
el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>ans(b.dataset.k));if($('#ok'))$('#ok').onclick=()=>ans($('#in').value)};
if(min){clearInterval(tm);tm=setInterval(()=>{const s=Math.round((end-Date.now())/1e3),t=$('#tt');if(s<=0)fin();else if(t)t.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500)}show()}
const emitChemCtx=h=>{if(!window.SchoolHubAI)return;const names={home:'Tổng quan Hóa học',theory:'Lý thuyết Hóa',table:'Bảng tuần hoàn',exercises:'Bài tập Hóa',practice:'Luyện tập Hóa',reactions:'Cân bằng & Tính mol',mol:'Phân tử 3D',lab:'Thí nghiệm & Chuẩn độ pH',formula:'Công thức Hóa',ai:'Trợ lý AI Hóa học',test:'Kiểm tra Hóa',rank:'Xếp hạng'};window.SchoolHubAI.emitContext({subjectId:'chemistry',view:h,topic:names[h]||h,summary:`XP: ${st.xp} · Kho ${S.g('qs',QS0).length} câu · ${S.g('fm',FM0).length} công thức`})};
if(window.SchoolHubAI){window.SchoolHubAI.onHostCommand(msg=>{if(msg.type==='host:inject-quiz'&&msg.payload&&Array.isArray(msg.payload.questions)){const curQs=S.g('qs',QS0);msg.payload.questions.forEach(q=>curQs.unshift({q:q.question,o:q.options||[],a:'ABCD'[Number(q.correctIndex)||0]||'A',ch:msg.payload.topic||'Hóa AI',lv:2,ex:q.explanation||''}));S.s('qs',curQs);location.hash='#exercises'}else if(msg.type==='host:inject-cards'&&msg.payload&&Array.isArray(msg.payload.cards)){const curFm=S.g('fm',FM0);msg.payload.cards.forEach(c=>curFm.unshift({t:c.front,c:c.example||c.front,n:c.back}));S.s('fm',curFm);location.hash='#formula'}})}
function go(){const h=location.hash.slice(1)||'home';stop();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.hash=='#'+h));const m=$('#app');m.innerHTML='';(V[h]||V.home)(m);emitChemCtx(h)}
addEventListener('hashchange',go);go();
</script></body></html>
