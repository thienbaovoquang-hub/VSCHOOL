<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Vật Lý Cute</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--b1:#eef3fb;--b2:#eef3fb;--card:#ffffff;--tx:#1e293b;--mu:#64748b;--ac:#e11d74;--ac2:#2563eb;--bd:#dbe4f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#0f172a;--b2:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155}}
:root[data-theme="dark"]{--b1:#0f172a;--b2:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:var(--b1);min-height:100vh}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd)}
nav a{white-space:nowrap;padding:6px 10px;font-size:13.5px;border-radius:99px;color:var(--tx);text-decoration:none;transition:.2s}nav a:hover{transform:translateY(-2px)}nav a.on{background:var(--ac2);color:#fff}
main{max-width:1000px;margin:auto;padding:14px}h2{margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 16px rgba(15,23,42,.08)}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit;color:var(--tx);border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:7px 12px}
button{cursor:pointer;background:var(--ac2);color:#fff;border:0;transition:.15s}button:hover{transform:scale(1.04)}button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
input[type=range]{padding:0;width:100%}textarea{width:100%;min-height:80px}canvas{width:100%;border-radius:14px;background:var(--card);display:block}
.mu{color:var(--mu);font-size:13px}.big{font-size:28px;font-weight:700}.ok{color:#1fb37a}.no{color:#e5484d}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:left}.sc{overflow-x:auto}
.bar{height:10px;border-radius:9px;background:var(--ac2)}.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:12px}
</style></head><body><nav id="nav"></nav><main id="app"></main>
<script src="/assets/aistudio/subject-ai-bridge.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tex=s=>{try{return katex.renderToString(s,{output:'mathml',throwOnError:false})}catch(e){return esc(s)}};
const rich=s=>String(s??'').split(/\$(.+?)\$/g).map((p,i)=>i%2?tex(p):esc(p)).join('');
const seed={name:'Bạn',hist:[],q:[
{id:1,topic:'Động học',level:1,type:'mcq',q:'Xe chạy đều 72 km/h. Vận tốc theo m/s?',o:['10','20','30','72'],a:'B',sol:'72 : 3,6 = 20 m/s'},
{id:2,topic:'Động học',level:2,type:'num',q:'Vật rơi tự do từ nghỉ trong 3 s (g = 10 m/s²). Quãng đường rơi (m)?',a:'45',sol:'s = ½gt² = ½·10·9 = 45 m'},
{id:3,topic:'Động lực học',level:1,type:'num',q:'Lực 10 N tác dụng lên vật 2 kg. Gia tốc (m/s²)?',a:'5',sol:'a = F/m = 10/2 = 5 m/s²'}],
th:[{grade:'10',topic:'Động học',title:'Chuyển động thẳng biến đổi đều',body:'Gia tốc không đổi. $v=v_0+at$, $s=v_0t+\\frac{1}{2}at^2$, $v^2-v_0^2=2as$.'},
{grade:'10',topic:'Động lực học',title:'Định luật II Newton',body:'Gia tốc tỉ lệ thuận với hợp lực, tỉ lệ nghịch với khối lượng: $\\vec a=\\vec F/m$.'}],
fm:[{topic:'Động học',name:'Vận tốc',tex:'v=v_0+at',sym:'v: vận tốc (m/s); a: gia tốc (m/s²); t: thời gian (s)',ex:'v0=2, a=3, t=4 → v=14 m/s'},
{topic:'Điện',name:'Định luật Ôm',tex:'I=\\frac{U}{R}',sym:'I (A); U (V); R (Ω)',ex:'U=12, R=4 → I=3 A'},
{topic:'Dao động',name:'Chu kỳ con lắc lò xo',tex:'T=2\\pi\\sqrt{\\frac{m}{k}}',sym:'m (kg); k (N/m)',ex:'m=1, k=100 → T≈0,63 s'}]};
let D;try{D=JSON.parse(localStorage.getItem('phy1'))}catch(e){}D=D||seed;const save=()=>{try{localStorage.setItem('phy1',JSON.stringify(D))}catch(e){}};
const nid=()=>Date.now()+Math.random();
/* ---- plot ---- */
const COL=['#ff5fa2','#5b8cff','#2fc79a'];
function plot(cv,rows,names=[]){const cw=cv.clientWidth,ch=cv.clientHeight;if(cv.width!==cw)cv.width=cw;if(cv.height!==ch)cv.height=ch;const W=cv.width,H=cv.height,c=cv.getContext('2d');c.clearRect(0,0,W,H);if(rows.length<2)return;const n=rows[0].length-1;let a=1e18,b=-1e18,x0=rows[0][0],x1=rows[0][0];for(const r of rows){x0=Math.min(x0,r[0]);x1=Math.max(x1,r[0]);for(let k=1;k<=n;k++)if(isFinite(r[k])){a=Math.min(a,r[k]);b=Math.max(b,r[k])}}
if(a===b){a-=1;b+=1}if(x0===x1)x1+=1;const p=36,X=x=>p+(x-x0)/(x1-x0)*(W-p-8),Y=y=>H-18-(y-a)/(b-a)*(H-30);c.strokeStyle='#9996';c.fillStyle='#999';c.font='11px sans-serif';
c.beginPath();c.moveTo(p,Y(a));c.lineTo(p,Y(b));if(a<0&&b>0){c.moveTo(p,Y(0));c.lineTo(W,Y(0))}else{c.moveTo(p,Y(a));c.lineTo(W,Y(a))}c.stroke();
[a,b].forEach(v=>c.fillText(+v.toPrecision(3),0,Y(v)+4));[x0,x1].forEach((v,i)=>c.fillText(+v.toPrecision(3),i?W-30:p,H-4));
for(let k=1;k<=n;k++){c.strokeStyle=c.fillStyle=COL[k-1];c.lineWidth=2;c.beginPath();let st=0;rows.forEach(r=>{if(!isFinite(r[k])){st=0;return}st?c.lineTo(X(r[0]),Y(r[k])):c.moveTo(X(r[0]),Y(r[k]));st=1});c.stroke();if(rows.length<80&&k==1)rows.forEach(r=>{c.beginPath();c.arc(X(r[0]),Y(r[k]),3,0,7);c.fill()});if(names[k-1])c.fillText(names[k-1],p+8+(k-1)*70,12)}}
/* ---- importer ---- */
const COLS={q:['topic','grade','className','level','type','question','a','b','c','d','answer','solution'],th:['grade','className','topic','title','content'],fm:['grade','className','topic','name','formula','unit','example']};
const MAP={q:r=>{const o=[r.a,r.b,r.c,r.d].filter(x=>x!==undefined&&x!=='').map(String),m=o.length>1&&!/^n/i.test(r.type||'');return{id:nid(),topic:r.topic||'Khác',grade:String(r.grade||''),className:String(r.className||'').trim(),level:+r.level||1,type:m?'mcq':'num',q:String(r.question||''),o:m?o:undefined,a:m?String(r.answer).trim().toUpperCase():String(r.answer).replace(',','.'),sol:String(r.solution||'')}},
th:r=>({grade:String(r.grade||''),className:String(r.className||'').trim(),topic:r.topic||'Khác',title:r.title||'',body:String(r.content||'')}),fm:r=>({grade:String(r.grade||''),className:String(r.className||'').trim(),topic:r.topic||'Khác',name:r.name||'',tex:r.formula||'',unit:r.unit||'',sym:r.symbols||r.unit||'',ex:r.example||''})};
const KEY={q:'q',th:'th',fm:'fm'};
function importer(t,after){const d=document.createElement('div');d.className='card';const mod=t==='q'?'questions':t==='fm'?'formula':'lessons';d.innerHTML=`<div class="r"><b>📥 Excel dữ liệu</b><button class="s dl" type="button">⬇ Tải file mẫu (.xlsx)</button><button class="s exp" type="button">📤 Xuất Excel (.xlsx)</button><input type="file" accept=".xlsx,.xls" class="f"></div><div class="pv"></div>`;
d.querySelector('.dl').onclick=async()=>{try{if(window.SchoolHubAI&&window.SchoolHubAI.downloadSubjectTemplate){await window.SchoolHubAI.downloadSubjectTemplate('physics',mod);return}}catch(e){window.SchoolHubAI&&window.SchoolHubAI.notify&&window.SchoolHubAI.notify(e.message||'Không tải được mẫu',true)}};
d.querySelector('.exp').onclick=async()=>{try{if(!window.SchoolHubAI||!window.SchoolHubAI.exportSubjectExcel)return;const src=D[KEY[t]]||[];const rows=src.map(x=>{if(t==='q')return{topic:x.topic||'Chung',grade:x.grade?`Lớp ${String(x.grade).replace(/^Lớp\s*/i,'')}`:'Lớp 10',className:x.className||'',question:x.q||'',optionA:x.o?.[0]||'',optionB:x.o?.[1]||'',optionC:x.o?.[2]||'',optionD:x.o?.[3]||'',answer:x.a||'A',explain:x.sol||''};if(t==='fm')return{name:x.name||'',grade:x.grade?`Lớp ${String(x.grade).replace(/^Lớp\s*/i,'')}`:'Lớp 10',topic:x.topic||'Chung',expression:x.tex||'',unit:x.unit||x.sym||'',note:x.ex||'',className:x.className||''};return{title:x.title||'',grade:x.grade?`Lớp ${String(x.grade).replace(/^Lớp\s*/i,'')}`:'Lớp 10',topic:x.topic||'Chung',difficulty:'Thông hiểu',summary:x.body||'',formula:'',className:x.className||''}});await window.SchoolHubAI.exportSubjectExcel('physics',mod,rows)}catch(e){window.SchoolHubAI&&window.SchoolHubAI.notify&&window.SchoolHubAI.notify(e.message||'Không xuất được Excel',true)}};
d.querySelector('.f').onchange=async e=>{const f=e.target.files[0];if(!f)return;let rows=[],tags=[];const pv=d.querySelector('.pv');
 try{
  if(window.SchoolHubAI&&window.SchoolHubAI.parseSubjectExcelFile){
   const res=await window.SchoolHubAI.parseSubjectExcelFile('physics',mod,f);
   if(res&&Array.isArray(res.rows)&&res.rows.length){
    tags=[...(res.sheetNames||[]).map(s=>'Tab: '+s),...(res.discoveredGrades||[]),...(res.discoveredClasses||[]).map(c=>'Lớp: '+c),...(res.discoveredTopics||[])];
    rows=res.rows.map(r=>{
     const gr=String(r.grade||'').replace(/^Lớp\s*/i,'').trim()||'10';
     if(t==='q')return{topic:r.topic||'Chung',grade:gr,className:r.className||'',level:r.level||2,type:'mcq',question:r.question||'',a:r.optionA||'',b:r.optionB||'',c:r.optionC||'',d:r.optionD||'',answer:r.answer||'A',solution:r.explain||''};
     if(t==='fm')return{grade:gr,className:r.className||'',topic:r.topic||'Chung',name:r.name||r.title||'',formula:r.expression||r.formula||'',unit:r.unit||'',symbols:[r.unit,r.grade,r.className].filter(Boolean).join(' · '),example:r.note||r.summary||''};
     return{grade:gr,className:r.className||'',topic:r.topic||'Chung',title:r.title||'',content:r.summary||(r.formula?r.formula:'')};
    });
   }
  }
  if(!rows.length){
   const wb=XLSX.read(await f.arrayBuffer());
   wb.SheetNames.forEach(sName=>{if(/^(huong_dan|danh_muc)/i.test(sName))return;const infG=(sName.match(/(\d{1,2})/)||[])[1]||'';const list=XLSX.utils.sheet_to_json(wb.Sheets[sName],{defval:''}).map(r=>{const n=Object.fromEntries(Object.entries(r).map(([k,v])=>[k.trim().toLowerCase(),v]));if(!n.grade&&infG)n.grade=infG;return n}).filter(r=>Object.values(r).some(v=>v!==''));rows.push(...list)});
  }
 }catch(x){pv.textContent=x?.message||'Không đọc được file.';return}
 if(!rows.length){pv.textContent='File trống hoặc chưa đúng cấu trúc.';return}
 pv.innerHTML=`<p>${rows.length} dòng ${tags.length?tags.slice(0,8).map(tg=>`<span class="tag">${esc(tg)}</span>`).join(' '):''}</p><div class="sc"><table><tr>${COLS[t].map(c=>`<th>${c}</th>`).join('')}</tr>${rows.slice(0,30).map((r,i)=>`<tr>${COLS[t].map(c=>`<td contenteditable data-i="${i}" data-k="${c}">${esc(r[c])}</td>`).join('')}</tr>`).join('')}</table></div><button class="ok2">✅ Xác nhận lưu (${rows.length})</button>`;
 pv.querySelectorAll('td').forEach(td=>td.oninput=()=>rows[td.dataset.i][td.dataset.k]=td.textContent);
 pv.querySelector('.ok2').onclick=async()=>{const bad=t=='q'?rows.filter(r=>!r.question||r.answer==='').length:0;if(bad&&window.SchoolHubAI&&window.SchoolHubAI.confirmAction){const ok=await window.SchoolHubAI.confirmAction(bad+' dòng thiếu câu hỏi/đáp án sẽ bị bỏ qua. Tiếp tục?','Tiếp tục',false);if(!ok)return}const add=rows.filter(r=>t!='q'||(r.question&&r.answer!=='')).map(MAP[t]);D[KEY[t]].push(...add);save();const cls=[...new Set(add.map(x=>x.className).filter(Boolean))];if(cls.length&&window.SchoolHubAI&&window.SchoolHubAI.syncClassesToHost)window.SchoolHubAI.syncClassesToHost('physics',cls,'excel-import');window.SchoolHubAI&&window.SchoolHubAI.notify&&window.SchoolHubAI.notify(`Đã lưu ${add.length} mục Vật Lý`);after()}};return d}
/* ---- pages ---- */
const PG={};
PG.home=h=>{const H=D.hist,n=H.length,ok=H.reduce((a,x)=>a+x.ok,0),tot=H.reduce((a,x)=>a+x.n,0),by={};H.forEach(x=>Object.entries(x.by).forEach(([k,[o,m]])=>{by[k]=by[k]||[0,0];by[k][0]+=o;by[k][1]+=m}));
h.innerHTML=`<h2>🌸 Tổng quan</h2><div class="g"><div class="card"><div class="mu">Lượt làm</div><div class="big">${n}</div></div><div class="card"><div class="mu">Độ chính xác</div><div class="big">${tot?Math.round(ok/tot*100):0}%</div></div><div class="card"><div class="mu">Điểm tích luỹ</div><div class="big">${H.reduce((a,x)=>a+x.pts,0)}</div></div><div class="card"><div class="mu">Kho dữ liệu</div><div>${D.q.length} bài · ${D.th.length} lý thuyết · ${D.fm.length} công thức</div></div></div>
<div class="card"><b>Theo chủ đề</b>${Object.entries(by).map(([k,[o,m]])=>`<div class="mu">${esc(k)} · ${o}/${m}</div><div class="bar" style="width:${o/m*100}%"></div>`).join('')||'<div class="mu">Chưa có dữ liệu. Hãy làm một bài Luyện tập hoặc Kiểm tra.</div>'}</div>
<div class="card"><b>Hoạt động gần đây</b>${H.slice(-6).reverse().map(x=>`<div>${x.mode} · ${x.ok}/${x.n} · ${new Date(x.d).toLocaleString('vi-VN')}</div>`).join('')||'<div class="mu">—</div>'}</div>`};
function filt(items,keys,h,render,t){const ctl=document.createElement('div');ctl.className='r card';ctl.innerHTML=keys.map(k=>`<select data-k="${k}"><option value="">${k==='grade'?'Khối':k==='topic'?'Chủ đề':k==='level'?'Mức độ':k==='type'?'Loại':k}: tất cả</option>${[...new Set(items.map(x=>x[k]).filter(Boolean))].map(v=>`<option>${esc(v)}</option>`).join('')}</select>`).join('')+`<input class="qs" placeholder="Tìm…">`;const out=document.createElement('div');const up=()=>{let l=items.filter(x=>[...ctl.querySelectorAll('select')].every(s=>!s.value||String(x[s.dataset.k])===s.value));const s=ctl.querySelector('.qs').value.toLowerCase();if(s)l=l.filter(x=>JSON.stringify(x).toLowerCase().includes(s));out.innerHTML=l.map(x=>render(x,items.indexOf(x))).join('')||'<div class="mu">Chưa có dữ liệu — hãy nhập Excel.</div>'};ctl.oninput=up;h.append(ctl,out);up()}
const PHY_PROMPTS={};
const phyBtn=(id,label,prompt)=>{PHY_PROMPTS[id]=prompt;return `<button class="s" onclick="phyExplainInline('${id}')">${label}</button>`};
const phyExplainInline=async(id,directPrompt)=>{const prompt=directPrompt||PHY_PROMPTS[id];const b=$('#'+id);if(!b||!prompt||!window.SchoolHubAI)return;b.style.display='block';b.innerHTML='<span class="mu">AI đang phân tích...</span>';try{const text=await window.SchoolHubAI.streamAssist({subjectId:'physics',mode:'wrong_answer_coach',prompt,onDelta:(_d,full)=>{b.innerHTML=rich(full).replace(/\n/g,'<br>')},onDone:(finalText)=>{b.innerHTML=rich(finalText).replace(/\n/g,'<br>')}});if(text&&!b.innerHTML.trim()){b.innerHTML=rich(text).replace(/\n/g,'<br>')}}catch(e){b.innerHTML=`<span class="no">⚠ ${esc(e.message||'Không gọi được AI')}</span>`}};
const genPhyQAI=async(after)=>{if(!window.SchoolHubAI)return;const tp=$('#t')?.value||(await window.SchoolHubAI.askTopic('Nhập chủ đề Vật Lý muốn sinh câu hỏi AI (vd: Động học, Định luật Newton, Điện học, Dao động cơ):','Động học & Định luật Newton'));if(!tp)return;const btn=$('#gen_phy_q');if(btn){btn.disabled=true;btn.textContent='⏳ Đang tạo...'}try{const res=await window.SchoolHubAI.generateQuiz({subjectId:'physics',topic:tp,count:4});const qs=Array.isArray(res.questions)?res.questions:[];if(!qs.length)return window.SchoolHubAI.notify('AI chưa tạo được câu hỏi.',true);qs.forEach(q=>D.q.unshift({id:nid(),topic:tp,level:2,type:'mcq',q:q.question,o:q.options||[],a:'ABCD'[Number(q.correctIndex)||0]||'A',sol:q.explanation||''}));save();window.SchoolHubAI.notify(`Đã tạo ${qs.length} câu hỏi Vật Lý AI!`);after&&after()}catch(e){window.SchoolHubAI.notify('Lỗi AI: '+(e.message||'Không tạo được câu hỏi'),true)}finally{if(btn){btn.disabled=false;btn.textContent='✨ Sinh câu hỏi AI'}}};
const phyDel=async(key,idx,cb)=>{if(window.SchoolHubAI&&window.SchoolHubAI.confirmAction){const ok=await window.SchoolHubAI.confirmAction('Xóa mục này khỏi kho Vật Lý?','Xóa mục');if(!ok)return}D[key].splice(idx,1);save();cb()};

proj:{n:'Ném xiên',P:[['v₀ (m/s)',20,5,40,1],['góc (°)',45,5,85,1],['g (m/s²)',9.8,1,25,.1]],tm:p=>2*p[0]*Math.sin(p[1]*Math.PI/180)/p[2],names:['y (m)'],
init:p=>({t:0,h:[]}),step(s,p,dt){s.t=Math.min(s.t+dt,this.tm(p));const a=p[1]*Math.PI/180;s.x=p[0]*Math.cos(a)*s.t;s.y=p[0]*Math.sin(a)*s.t-p[2]*s.t*s.t/2;s.vy=p[0]*Math.sin(a)-p[2]*s.t;if(s.n++%4==0)s.h.push([s.t,s.y])},

read:(s,p)=>[['t',s.t,'s'],['x',s.x||0,'m'],['y',s.y||0,'m'],['v_y',s.vy??p[0]*Math.sin(p[1]*Math.PI/180),'m/s']]},

init:p=>({t:0,x:.8,v:0,h:[]}),step(s,p,dt){if(s.drag)return;const k=4;for(let i=0;i<k;i++){const a=-(p[1]/p[0])*s.x-(p[2]/p[0])*s.v;s.v+=a*dt/k;s.x+=s.v*dt/k}s.t=Math.min(s.t+dt,15);if(s.n++%4==0)s.h.push([s.t,s.x,s.v])},

init:p=>({t:0,x1:2,x2:7,v1:p[2],v2:p[3],h:[]}),step(s,p,dt){const[m1,m2,,,e]=p,w1=.2+.05*m1,w2=.2+.05*m2;s.x1+=s.v1*dt;s.x2+=s.v2*dt;if(s.x1+w1>=s.x2-w2&&s.v1>s.v2){const a=s.v1,b=s.v2;s.v1=((m1-e*m2)*a+(1+e)*m2*b)/(m1+m2);s.v2=((m2-e*m1)*b+(1+e)*m1*a)/(m1+m2)}if(s.x1-w1<0&&s.v1<0)s.v1*=-1;if(s.x2+w2>10&&s.v2>0)s.v2*=-1;s.t=Math.min(s.t+dt,10);if(s.n++%4==0)s.h.push([s.t,s.v1,s.v2])},

/* router */
const NAV=[['home','🏠 Trang chủ'],['theory','📖 Lý thuyết'],['ex','🧩 Bài tập'],['prac','✏️ Luyện tập'],['sim','🎈 Mô phỏng'],['nasa','🚀 Vũ trụ NASA'],['graph','📈 Đồ thị'],['fm','🧮 Công thức'],['ai','🤖 Trợ lý AI'],['gauth','✨ Gauth'],['test','⏱️ Kiểm tra'],['rank','🏆 Xếp hạng']];
$('#nav').innerHTML=NAV.map(([k,t])=>`<a href="#${k}" data-k="${k}">${t}</a>`).join('');
const emitPhyCtx=k=>{if(!window.SchoolHubAI)return;const names={home:'Tổng quan Vật Lý',theory:'Lý thuyết Vật Lý',ex:'Kho bài tập Vật Lý',prac:'Luyện tập Vật Lý',sim:'Mô phỏng Vật Lý',nasa:'Vũ trụ NASA Open APIs',graph:'Đồ thị & Hồi quy',fm:'Công thức Vật Lý',ai:'Trợ lý AI Vật Lý',gauth:'Gauth Vật Lý',test:'Kiểm tra Vật Lý',rank:'Xếp hạng'};const H=D.hist||[],ok=H.reduce((a,x)=>a+x.ok,0),tot=H.reduce((a,x)=>a+x.n,0),acc=tot?Math.round(ok/tot*100):0;window.SchoolHubAI.emitContext({subjectId:'physics',view:k,topic:names[k]||k,summary:`${D.q.length} bài tập · ${D.th.length} lý thuyết · ${D.fm.length} công thức`});if(window.SchoolHubAI.emitStats)window.SchoolHubAI.emitStats({subjectId:'physics',completedCount:ok,totalCount:tot+D.q.length,scoreLabel:tot?`${acc}%`:`${D.q.length} bài`,customTopicsCount:new Set(D.q.map(x=>x.topic).filter(Boolean)).size})};
if(window.SchoolHubAI){window.SchoolHubAI.onHostCommand(msg=>{if(msg.type==='iframe:navigate'&&msg.view){const target='#'+msg.view;if(location.hash===target)route();else location.hash=target}else if(msg.type==='host:inject-quiz'&&msg.payload&&Array.isArray(msg.payload.questions)){msg.payload.questions.forEach(q=>D.q.unshift({id:nid(),topic:msg.payload.topic||'Vật Lý AI',level:2,type:'mcq',q:q.question,o:q.options||[],a:'ABCD'[Number(q.correctIndex)||0]||'A',sol:q.explanation||''}));save();location.hash='#ex'}else if(msg.type==='host:inject-cards'&&msg.payload&&Array.isArray(msg.payload.cards)){msg.payload.cards.forEach(c=>D.fm.unshift({topic:msg.payload.topic||'Vật Lý AI',name:c.front,tex:c.front,sym:c.back,ex:c.example||''}));save();location.hash='#fm'}})}
function route(){simTok++;const k=PG[location.hash.slice(1)]?location.hash.slice(1):'home';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));const m=$('#app');m.innerHTML='';PG[k](m);emitPhyCtx(k);window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
