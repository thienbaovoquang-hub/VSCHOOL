<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Lingo – Học tiếng Anh</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--b1:#eef4fb;--b2:#eef4fb;--b3:#eef4fb;--c:#ffffff;--b:#dbe4f0;--s:#fff;--t:#17365d;--m:#5f7ea3;--p:#0284c7;--u:#2563eb;--g:#0d9488;--r:#e11d48;--sh:0 6px 20px rgba(15,23,42,.08);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--b1:#0f172a;--b2:#0f172a;--b3:#0f172a;--c:#1e293b;--b:#334155;--s:#172a4d;--t:#eaf3ff;--m:#9db8d9}}
:root[data-theme=dark]{color-scheme:dark;--b1:#0f172a;--b2:#0f172a;--b3:#0f172a;--c:#1e293b;--b:#334155;--s:#172a4d;--t:#eaf3ff;--m:#9db8d9}
body{margin:0;font:15px/1.5 Nunito,"Segoe UI",system-ui,sans-serif;color:var(--t);background:var(--b2)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--b1)}
#app{display:flex}main{flex:1;min-width:0;max-width:980px;margin:auto;padding:16px 20px}
#nv{position:sticky;top:0;height:100vh;width:170px;padding:16px 10px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
#nv button{border:0;background:none;text-align:left;padding:10px 14px;border-radius:16px;cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;transition:.2s}
#nv button:hover{background:var(--c);transform:translateX(4px)}#nv button.on{background:var(--u);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.28)}#nv i{font-style:normal}
header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:800}#us{display:flex;gap:4px;align-items:center}#us select{width:auto}
h1{font-size:24px;margin:6px 0 14px}h2{font-size:20px;margin:4px 0}h3,h4{margin:4px 0 8px}
.c{background:var(--c);border:1px solid var(--b);border-radius:22px;box-shadow:var(--sh);padding:16px;margin-bottom:14px;transition:.25s}
.g3 .c:hover,.g4 .c:hover{transform:translateY(-3px)}
button,input,select,textarea{font:inherit;color:inherit}
.b{border:0;border-radius:99px;padding:9px 18px;background:var(--u);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,235,.28);transition:.2s}
.b:hover{transform:translateY(-2px) scale(1.03)}.b.g{background:var(--c);color:var(--t);box-shadow:none;border:1px solid var(--b)}.b.gr{background:#10b981}
.ic{border:0;background:none;cursor:pointer;font-size:16px;transition:.2s}.ic:hover{transform:scale(1.3)}
input,select,textarea{width:100%;padding:9px 13px;border-radius:14px;border:1px solid var(--b);background:var(--c);margin:4px 0;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--u);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.bar>input,.bar>select{flex:1;min-width:130px;width:auto}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.g3 .c{margin:0}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}.g4 .c{margin:0;text-align:center}.g4 b{font-size:24px;display:block}
.mu{color:var(--m)}.tg{display:inline-block;background:rgba(59,130,246,.22);border-radius:99px;padding:1px 10px;font-size:12px;margin:0 3px 3px 0}
.w{display:flex;justify-content:space-between;gap:8px}.mid{text-align:center}.big{font-size:56px}.pre{white-space:pre-wrap}
mark{background:rgba(255,211,110,.6);color:inherit;border-radius:6px;padding:0 4px}summary{cursor:pointer}
.op{display:grid;gap:8px;margin:12px 0}
.o{display:block;width:100%;text-align:left;padding:11px 16px;border-radius:16px;border:2px solid var(--b);background:var(--c);cursor:pointer;transition:.2s;margin:4px 0}
button.o:hover{border-color:var(--u);transform:translateX(4px)}.o.sel{border-color:var(--u);background:rgba(59,130,246,.25)}
.o.ok{border-color:var(--g);background:rgba(95,211,176,.35);animation:bn .4s}.o.no{border-color:var(--r);background:rgba(255,122,147,.3);animation:sk .4s}.o.dim{opacity:.55}
.gd{color:#2bb38a;font-weight:800}.ng{color:var(--r);font-weight:800}
@keyframes bn{50%{transform:scale(1.04)}}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes pop{from{opacity:0;transform:translateY(12px)}}
.a{animation:pop .35s}
.ch{cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;font-weight:700;padding:16px}.ch i{font-size:30px;font-style:normal}.ch small{color:var(--m);font-weight:400}
.pg{height:10px;border-radius:9px;background:var(--c);overflow:hidden;margin:8px 0}.pg i{display:block;height:100%;background:var(--u);transition:width .4s}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--m);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;border-radius:8px 8px 4px 4px;background:var(--u);min-height:4px;margin-bottom:4px}
.rk{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px}.rk span{flex:1;font-weight:700}.rk small{color:var(--m)}.rk.me{background:rgba(56,189,248,.25)}
.fc{perspective:900px;height:240px;margin:16px 0;cursor:pointer}.in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.fc.f .in{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:30px;font-weight:800;padding:16px;text-align:center;box-shadow:var(--sh);color:#17365d}
.fa{background:#bae6fd}.fb{background:#a7f3d0;transform:rotateY(180deg)}.fa small,.fb small{font-size:13px;font-weight:400;margin-top:8px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.48);display:grid;place-items:center;padding:14px;z-index:20}.md{width:min(760px,100%);max-height:88vh;overflow:auto;margin:0;background:var(--s)}
.tw{overflow-x:auto;max-height:45vh;margin:8px 0}table{border-collapse:collapse;font-size:13px}td input{min-width:90px;margin:1px;padding:5px 8px}th{text-align:left;padding:4px}tr.bad{background:rgba(255,122,147,.22)}
.t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--t);color:var(--s);padding:9px 18px;border-radius:99px;z-index:30;animation:pop .3s}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--s);border-radius:18px;padding:10px 14px;box-shadow:var(--sh)}
.lk{opacity:.35;filter:grayscale(1)}.bd{display:inline-block;text-align:center;margin:6px 10px;font-size:12px}.bd i{display:block;font-size:30px;font-style:normal}
.chat-box{display:flex;flex-direction:column;gap:10px;min-height:130px;margin:10px 0}.bb{padding:12px 15px;border-radius:18px;max-width:92%;white-space:pre-wrap;line-height:1.55}.bb.u{background:var(--u);color:#fff;margin-left:auto}.bb.a{background:var(--c);border:1px solid var(--b)}.bb.err{border-color:var(--r);color:var(--r)}
@media(max-width:800px){#app{display:block}#nv{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;gap:2px;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--s);box-shadow:0 -4px 20px rgba(59,130,246,.2)}
#nv button{flex:0 0 auto;min-width:56px;flex-direction:column;gap:0;padding:4px 6px;text-align:center;font-size:10px;white-space:nowrap}#nv i{font-size:20px}main{padding:12px 12px 90px}.fa,.fb{font-size:24px}}
</style></head><body><div id="app"><nav id="nv"></nav><main><header><span class="logo">🐰 Lingo</span><span id="us"></span></header><div id="v"></div></main></div><div id="m"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/assets/aistudio/subject-ai-bridge.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),nid=()=>Math.random().toString(36).slice(2,9),sh=a=>[...a].sort(()=>Math.random()-.5),J=(a,f)=>a.map(f).join(''),L=['A1','A2','B1','B2','C1','C2'];
let S;try{S=JSON.parse(localStorage.getItem('lingo'))}catch(e){}
S=S||{vocab:[],gram:[],qs:[],tests:[],users:{},cur:'Bạn'};
const save=()=>{try{localStorage.setItem('lingo',JSON.stringify(S))}catch(e){}};
const U=()=>S.users[S.cur]||(S.users[S.cur]={xp:0,ok:0,tot:0,hist:[],fc:{},wr:{},days:{}});
const day=(o=0)=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4-o*864e5).toISOString().slice(0,10);
const streak=u=>{let n=0,o=u.days[day()]?0:1;while(u.days[day(o+n)])n++;return n};
const act=(n=1)=>{let u=U();u.days[day()]=(u.days[day()]||0)+n};
const hs=(t,s,n)=>{let u=U();u.hist=[...u.hist,{d:Date.now(),t,s,n}].slice(-50)};
const rec=(q,ok)=>{let u=U(),w=u.wr[q.k];u.tot++;act();if(ok){u.ok++;u.xp+=10;if(w){w.c>1?w.c--:delete u.wr[q.k]}}else u.wr[q.k]={...q,c:(w?w.c:0)+1}};
const T=m=>{let t=document.createElement('div');t.className='t';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2300)};
const M=h=>{$('#m').innerHTML=h?`<div class="ov" onclick="if(event.target==this)M()"><div class="c md">${h}</div></div>`:''};
const sp=t=>{try{speechSynthesis.cancel();t.split(/(?<=[.!?])\s+/).forEach(s=>{let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)})}catch(e){}};
const v=h=>{$('#v').innerHTML=`<div class="a">${h}</div>`};
const del=async(k,i)=>{if(window.SchoolHubAI&&window.SchoolHubAI.confirmAction){const ok=await window.SchoolHubAI.confirmAction('Xoá mục này khỏi danh sách?','Xoá');if(!ok)return}S[k]=S[k].filter(x=>x.id!=i);save();T('Đã xoá');go(R)};
const sel=(a,cur,all)=>`${all?`<option value="">${all}</option>`:''}${J(a,x=>`<option ${cur==x?'selected':''}>${E(x)}</option>`)}`;
const topics=()=>[...new Set(S.vocab.map(x=>x.t).filter(Boolean))];
const allTopics=()=>[...new Set([...S.vocab.map(x=>x.t),...S.gram.map(x=>x.tp),...S.qs.map(x=>x.tp)].filter(Boolean))];

/* ---------- câu hỏi tự động ---------- */
const bank=()=>[...S.qs,...S.tests.flatMap(t=>t.qs)].map(q=>({...q,k:'q:'+q.id}));
const genV=()=>S.vocab.length<2?[]:S.vocab.map(x=>{let f=Math.random()<.5,b=f?'m':'w',o=sh([x[b],...sh(S.vocab.filter(y=>y.id!=x.id&&y[b]!=x[b])).slice(0,3).map(y=>y[b])]);return{k:'v:'+x.id+f,tp:x.t,l:x.l,q:f?`“${x.w}” nghĩa là gì?`:`Từ tiếng Anh của “${x.m}” là gì?`,o,a:o.indexOf(x[b]),e:x.w+' = '+x.m+(x.ex?' — '+x.ex:'')}});
const genG=()=>{let all=S.gram.flatMap(g=>(g.ex||'').split('\n').map((s,n)=>[g,s,n])).filter(([,s])=>/\[.+?\]/.test(s)),ans=[...new Set(all.map(([,s])=>s.match(/\[(.+?)\]/)[1]))];
 return all.map(([g,s,n])=>{let m=s.match(/\[(.+?)\]/)[1],o=sh([m,...sh(ans.filter(x=>x!=m)).slice(0,3)]),c=s.replace(/[\[\]]/g,'');return{k:'g:'+g.id+n,tp:g.tp,l:g.l,q:s.replace(/\[.+?\]/,'___').replace(/[\[\]]/g,''),o,a:o.indexOf(m),e:g.t+': '+c}}).filter(q=>q.o.length>1)};
let PF={t:'',l:'',n:10};
const pool=k=>(k=='w'?Object.values(U().wr):[...(k=='all'||k=='v'?genV():[]),...(k=='all'||k=='g'?genG():[]),...(k=='all'||k=='u'?bank():[])]).filter(q=>(!PF.t||q.tp==PF.t)&&(!PF.l||q.l==PF.l));

/* ---------- điều hướng ---------- */
const P=[['home','🏠','Trang chủ'],['dict','📖','Từ điển'],['vocab','📚','Từ vựng'],['grammar','✏️','Ngữ pháp'],['flash','🃏','Thẻ'],['practice','🎯','Luyện tập'],['test','⏱️','Kiểm tra'],['ai','🤖','AI'],['gauth','✨','Gauth'],['rank','🏆','Xếp hạng']];
let R='home',tm,Q=null,V={q:'',t:'',l:''},F={t:'',l:'',o:0,i:0},G={t:'',l:''},VIEW={},AIH=[],AIM='tutor_chat',AI_CTX=true,AI_DRAFT='',AI_IMG=null,AI_BUSY=false;
const emitEnCtx=v=>{if(!window.SchoolHubAI)return;const names={home:'Trang chủ Tiếng Anh',dict:'Tra cứu Từ điển',vocab:'Kho từ vựng',grammar:'Ngữ pháp Tiếng Anh',flash:'Flashcards từ vựng',practice:'Luyện tập trắc nghiệm',test:'Đề thi Đọc / Nghe',ai:'Trợ lý AI Tiếng Anh',gauth:'Gauth Tiếng Anh',rank:'Xếp hạng'};const u=U(),wr=Object.keys(u.wr).length,known=S.vocab.filter(x=>u.fc[x.id]==1).length,acc=u.tot?Math.round(u.ok/u.tot*100):0;window.SchoolHubAI.emitContext({subjectId:'english',view:v,topic:names[v]||v,summary:`Từ vựng: ${S.vocab.length} · Ngữ pháp: ${S.gram.length} · Câu hỏi: ${S.qs.length}`,wrongCount:wr});if(window.SchoolHubAI.emitStats)window.SchoolHubAI.emitStats({subjectId:'english',completedCount:known+u.ok,totalCount:S.vocab.length+S.qs.length+u.tot,scoreLabel:u.tot?`${acc}% · ${u.xp} XP`:`${u.xp} XP`,customTopicsCount:allTopics().length})};
const go=p=>{R=P.some(x=>x[0]==p)?p:'home';clearInterval(tm);try{speechSynthesis.cancel();history.replaceState(null,'','#'+R)}catch(e){}
 $('#nv').innerHTML=J(P,x=>`<button class="${x[0]==R?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i><span>${x[2]}</span></button>`);VIEW[R]();emitEnCtx(R);scrollTo(0,0)};
const ub=()=>{$('#us').innerHTML=`<select onchange="S.cur=this.value;save();ub();go(R)">${sel(Object.keys(S.users),S.cur)}</select><button class="ic" title="Thêm người học" onclick="uf()">➕</button>`};
const uf=()=>M(`<h3>Người học mới</h3><input id="un" placeholder="Tên của bạn"><div class="bar"><button class="b g" onclick="M()">Huỷ</button><button class="b" onclick="un()">Tạo</button></div>`);
const un=()=>{let n=$('#un').value.trim().slice(0,20);if(!n||S.users[n])return T('Tên trống hoặc đã tồn tại');S.cur=n;U();save();M();ub();go(R)};

/* ---------- Home ---------- */
VIEW.home=()=>{let u=U(),acc=u.tot?Math.round(u.ok/u.tot*100):0,known=S.vocab.filter(x=>u.fc[x.id]==1).length,wr=Object.keys(u.wr).length,
 d=[6,5,4,3,2,1,0].map(o=>[day(o).slice(8),u.days[day(o)]||0]),mx=Math.max(1,...d.map(x=>x[1]));
 v(`<h1>Xin chào, ${E(S.cur)}</h1>${S.vocab.length+S.gram.length+S.qs.length+S.tests.length?'':`<div class="c bar"><span><b>Bắt đầu nhanh:</b> Tải file mẫu Excel đa Sheet tab để nạp từ vựng hoặc đề thi.</span><span><button class="b" onclick="imp('vocab')">📥 Từ vựng</button> <button class="b g" onclick="imp('test')">📥 Đề thi</button></span></div>`}
 <div class="g4">${J([['⭐',u.xp,'Điểm XP'],['🔥',streak(u),'Ngày liên tiếp'],['🎯',acc+'%','Chính xác'],['🧠',known+'/'+S.vocab.length,'Đã thuộc']],x=>`<div class="c">${x[0]}<b>${x[1]}</b><span class="mu">${x[2]}</span></div>`)}</div>
 <div class="g2"><div class="c"><h3>📈 7 ngày qua</h3><div class="bars">${J(d,x=>`<div><i style="height:${x[1]/mx*80}px"></i>${x[0]}</div>`)}</div></div>
 <div class="c mid"><h3>💔 Ôn tập nhanh</h3><p class="mu">${wr} câu cần ôn lại</p><button class="b" onclick="ps('w')">Ôn ngay</button> <button class="b g" onclick="go('practice')">Luyện tập</button></div></div>
 <div class="c"><h3>🕘 Hoạt động gần đây</h3>${u.hist.length?J(u.hist.slice(-6).reverse(),h=>`<div class="rk"><span>${E(h.t)}</span><small>${new Date(h.d).toLocaleDateString('vi-VN')}</small><b>${h.s}/${h.n}</b></div>`):'<p class="mu">Chưa có bài làm.</p>'}</div>`)};

/* ---------- Vocabulary ---------- */
VIEW.vocab=()=>{v(`<div class="bar"><h1>📚 Từ vựng</h1><span><button class="b" onclick="vf()">＋ Thêm</button> <button class="b g" onclick="imp('vocab')">📥 Excel</button> <button class="b g" onclick="expEn('vocab')">📤 Xuất Excel</button></span></div>
 <div class="c bar"><input placeholder="🔍 Tìm từ..." value="${E(V.q)}" oninput="V.q=this.value;vl()"><select onchange="V.t=this.value;vl()">${sel(topics(),V.t,'Mọi chủ đề')}</select><select onchange="V.l=this.value;vl()">${sel(L,V.l,'Mọi cấp độ')}</select></div><div id="vl" class="g3"></div>`);vl()};
const vl=()=>{let u=U(),q=V.q.toLowerCase(),r=S.vocab.filter(x=>(!V.t||x.t==V.t)&&(!V.l||x.l==V.l)&&(x.w+x.m).toLowerCase().includes(q));
 $('#vl').innerHTML=r.length?J(r,x=>`<div class="c w"><div><b>${E(x.w)}</b> <button class="ic" data-t="${E(x.w)}" onclick="sp(this.dataset.t)">🔊</button><div class="mu">${E(x.m)}</div>${x.ex?`<i class="mu">“${E(x.ex)}”</i>`:''}</div><div style="text-align:right"><span class="tg">${E(x.t)}</span><span class="tg">${x.l}</span>${x.cl?`<span class="tg">${E(x.cl)}</span>`:''}${u.fc[x.id]==1?'✅':''}<br><button class="ic" title="Bổ sung IPA & Đồng nghĩa (Wiktionary)" onclick="enrichVocabItem('${E(x.id)}')">✨</button><button class="ic" title="Hỏi AI về từ này" data-w="${E(x.w)}" onclick="askAi('Giải thích phát âm IPA, cách dùng và đặt 2 câu ví dụ với từ: '+this.dataset.w)">🤖</button><button class="ic" onclick="vf('${x.id}')">✏️</button><button class="ic" onclick="del('vocab','${x.id}')">🗑️</button></div></div>`):'<p class="mu">Chưa có từ nào.</p>'};
const enrichVocabItem=async id=>{const x=S.vocab.find(a=>a.id==id);if(!x)return;T(`Đang tra Wiktionary cho "${x.w}"...`);try{const entry=await queryLexicon(x.w,'word');const syns=(entry.synonyms||[]).slice(0,4).join(', ');const def0=entry.meanings?.[0]?.definitions?.[0];const parts=[];if(entry.ipa&&!x.m.includes(entry.ipa))parts.push(entry.ipa);if(def0?.definition&&!x.m.includes(def0.definition.slice(0,18)))parts.push(def0.definition);if(syns)parts.push('Syn: '+syns);if(parts.length)x.m=`${x.m} (${parts.join(' · ')})`;if(!x.ex&&def0?.example)x.ex=def0.example;save();vl();T(`Đã bổ sung IPA & đồng nghĩa cho "${x.w}"!`)}catch(e){T('Không tra được: '+(e?.message||'Lỗi mạng'))}};

let DT={word:'resilient',mode:'word',loading:false,err:null,data:null,reqId:0,autoInit:false};
const saveDictWord=()=>{
 if(!DT.data||!DT.data.word)return;
 const w=String(DT.data.word).trim();
 const m0=(DT.data.meanings||[])[0];
 const d0=m0&&(m0.definitions||[])[0];
 const syns=(DT.data.synonyms||[]).slice(0,4).join(', ');
 const meaning=(d0&&d0.definition)||(syns?`Synonyms: ${syns}`:'Từ vựng tra từ Wiktionary & Datamuse');
 const ex=(d0&&d0.example)||'';
 const exists=S.vocab.some(x=>x.w.toLowerCase()===w.toLowerCase());
 if(exists)return T(`Từ "${w}" đã có trong Kho từ vựng!`);
 S.vocab.unshift({id:nid(),w,m:meaning,t:'Lexicon',l:'B1',ex});
 save();
 T(`Đã lưu "${w}" vào Kho từ vựng!`);
};
const queryLexicon=async(w,mode='word')=>{
 const r=await fetch(`/api/external/lexicon?word=${encodeURIComponent(w)}&lang=en&mode=${encodeURIComponent(mode)}`);
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||'Không thể tra cứu từ điển.');
 if(!d.entry)throw new Error(`Không tìm thấy dữ liệu cho "${w}".`);
 return d.entry;
};
const fetchDict=(w,modeOverride)=>{
 const nextMode=modeOverride||DT.mode||'word';
 w=(w||'').trim().replace(/\s+/g,' ');
 if(!w)return T(nextMode==='meaning'?'Vui lòng nhập mô tả nghĩa tiếng Anh cần tìm từ.':'Vui lòng nhập từ tiếng Anh cần tra.');
 const myId=++DT.reqId;
 DT.word=w;DT.mode=nextMode;DT.loading=true;DT.err=null;DT.data=null;DT.autoInit=true;
 if(R==='dict')VIEW.dict();
 queryLexicon(w,nextMode).then(entry=>{
  if(DT.reqId!==myId)return;
  DT.loading=false;DT.data=entry;
  if(R==='dict')VIEW.dict();
 }).catch(err=>{
  if(DT.reqId!==myId)return;
  DT.loading=false;DT.err=err?.message||'Không thể kết nối Wiktionary & Datamuse.';DT.data=null;
  if(R==='dict')VIEW.dict();
 });
};
const createLexiconQuiz=()=>{
 if(!DT.data||!DT.data.word)return;
 const w=String(DT.data.word).trim();
 const syns=(DT.data.synonyms||[]).filter(x=>x.toLowerCase()!==w.toLowerCase());
 const ants=(DT.data.antonyms||[]).filter(x=>x.toLowerCase()!==w.toLowerCase());
 if(!syns.length&&!ants.length)return T('Chưa có từ đồng/trái nghĩa từ Datamuse để tạo quiz.');
 const useSyn=syns.length>0;
 const ans=useSyn?syns[0]:ants[0];
 const distractors=sh(['ordinary','fragile','temporary','obsolete','arbitrary','hesitant'].filter(x=>x!==ans&&x!==w)).slice(0,3);
 const opts=sh([ans,...distractors]);
 S.qs.unshift({id:nid(),q:useSyn?`Which word is CLOSEST in meaning (synonym) to "${w}"?`:`Which word is OPPOSITE in meaning (antonym) to "${w}"?`,o:opts,a:opts.indexOf(ans),e:`"${ans}" is a ${useSyn?'synonym':'antonym'} of "${w}" (Datamuse + Wiktionary).`,tp:'Lexicon',l:'B1'});
 save();
 T(`Đã tạo câu trắc nghiệm ${useSyn?'đồng nghĩa':'trái nghĩa'} cho "${w}" vào Luyện tập!`);
};

};

const COL={vocab:['Word','Meaning','Topic','Level','Example','Class'],gram:['Title','Topic','Level','Theory','Examples','Class'],qs:['Question','A','B','C','D','Answer','Explanation','Topic','Level','Class'],test:['Test','Type','Level','Minutes','Passage','Question','A','B','C','D','Answer','Explanation','Class']};
const REQ={vocab:[0,1],gram:[0,3],qs:[0,1,2,5],test:[0,5,6,7,10]},TI={vocab:2,gram:1,qs:7},NAME={vocab:'Từ vựng',gram:'Ngữ pháp',qs:'Luyện tập',test:'Đề thi'},ICO={vocab:'📚',gram:'✏️',qs:'🎯',test:'⏱️'};
const SK=[['vocab',/vocab|từ vựng|tu vung|flash/i],['gram',/gram|ngữ pháp|ngu phap/i],['test',/test|kt_|đề|exam/i],['qs',/practice|luyện|luyen|question|câu hỏi|cau hoi|level_/i]];
let IM;
const enModOf=k=>k==='qs'?'quiz':k==='gram'?'grammar':k==='test'?'tests':'vocab';
const kindOf=(n,h)=>(SK.find(x=>x[1].test(n))||[])[0]||(h.some(x=>/từ vựng|word/.test(x))?'vocab':h.some(x=>/lý thuyết|theory/.test(x))?'gram':h.some(x=>/đoạn văn|passage|tên đề|test/.test(x))?'test':h.some(x=>/câu hỏi|question/.test(x))?'qs':'');
const AN=(o,a)=>{a=String(a).trim();let j=/^[A-Da-d]$/.test(a)?a.toUpperCase().charCodeAt()-65:/^[1-4]$/.test(a)?a-1:o.findIndex(x=>x&&x.toLowerCase()==a.toLowerCase());return j>=0?'ABCD'[j]:''};
const imp=k=>{const mod=enModOf(k);IM={hint:k,sh:[],cur:0,meta:null};M(`<h3>📥 Nhập Excel (${NAME[k]||'Tiếng Anh'})</h3><p class="mu">File mẫu chia sẵn Sheet tab & Drop-down (tự đồng bộ Lớp áp dụng lên Web).</p><div class="bar"><input type="file" accept=".xlsx,.xls" onchange="rd(this.files[0])"><button class="b g" onclick="tpl('${mod}')">⬇️ Tải mẫu (.xlsx)</button><button class="b g" onclick="expEn('${mod}')">📤 Xuất dữ liệu</button></div><div id="pv"></div>`)};
const rd=async f=>{if(!f)return;try{
 const modKey=enModOf(IM.hint);
 if(window.SchoolHubAI&&window.SchoolHubAI.parseSubjectExcelFile){
  const res=await window.SchoolHubAI.parseSubjectExcelFile('english',modKey,f);
  if(res&&Array.isArray(res.rows)&&res.rows.length){
   IM.sh=[];
   if(res.moduleKey==='quiz'){
    IM.sh.push({k:'qs',n:(res.sheetNames||['Quiz']).join(', '),rows:res.rows.map(r=>[r.question||'',r.optionA||'',r.optionB||'',r.optionC||'',r.optionD||'',r.answer||'A',r.explain||'',r.topic||'Chung',r.level||'B1',r.className||''])});
   }else if(res.moduleKey==='grammar'){
    IM.sh.push({k:'gram',n:(res.sheetNames||['Grammar']).join(', '),rows:res.rows.map(r=>[r.title||'',r.topic||'Chung',r.level||'B1',r.theory||'',r.examples||'',r.className||''])});
   }else if(res.moduleKey==='tests'){
    IM.sh.push({k:'test',n:(res.sheetNames||['Tests']).join(', '),rows:res.rows.map(r=>[r.testName||'Đề mẫu',r.testType||'Reading',r.level||'B1',r.minutes||'15',r.passage||'',r.question||'',r.optionA||'',r.optionB||'',r.optionC||'',r.optionD||'',r.answer||'A',r.explain||'',r.className||''])});
   }else{
    IM.sh.push({k:'vocab',n:(res.sheetNames||['Vocab']).join(', '),rows:res.rows.map(r=>[r.word||'',r.meaning||'',r.topic||'Chung',r.level||'A2',r.example||'',r.className||''])});
   }
   IM.meta=res;IM.cur=0;pv();return;
  }
 }
 let wb=XLSX.read(await f.arrayBuffer());IM.sh=[];IM.meta=null;
 wb.SheetNames.forEach(n=>{if(/^(huong_dan|danh_muc)/i.test(n))return;let a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}),h=(a[0]||[]).map(x=>String(x).trim().toLowerCase()),k=kindOf(n,h);if(!k)return;
  let ix=COL[k].map((x,i)=>h.includes(x.toLowerCase())?h.indexOf(x.toLowerCase()):i),sub=n.replace(SK.find(x=>x[0]==k)[1],'').replace(/^[\s\-_:.]+|[\s\-_:.]+$/g,''),
  inferredLv=/b2|c1/i.test(n)?'B2':/b1/i.test(n)?'B1':/a1|a2/i.test(n)?'A2':'';
  let rows=a.slice(1).map(r=>ix.map(i=>String(r[i]??'').trim())).filter(r=>r.some(Boolean));
  rows.forEach(r=>{if(TI[k]!=null&&!r[TI[k]]&&sub&&!/^\d+$/.test(sub))r[TI[k]]=sub;if((k=='vocab'||k=='gram')&&!r[k=='vocab'?3:2]&&inferredLv)r[k=='vocab'?3:2]=inferredLv;if(k=='qs'){if(!r[8]&&inferredLv)r[8]=inferredLv;r[5]=AN(r.slice(1,5),r[5])}if(k=='test')r[10]=AN(r.slice(6,10),r[10])});
  IM.sh.push({k,n,rows})});
 if(!IM.sh.length)return T('Không nhận ra sheet nào hợp lệ.');
 IM.cur=Math.max(0,IM.sh.findIndex(x=>x.k==IM.hint));pv()}catch(e){T(e.message||'Không đọc được file Excel!')}};
const okr=(k,r)=>REQ[k].every(i=>r[i]);
const pv=()=>{let s=IM.sh[IM.cur],cnt=x=>x.rows.filter(r=>okr(x.k,r)).length,tot=IM.sh.reduce((n,x)=>n+cnt(x),0);
 const tags=IM.meta?[...(IM.meta.discoveredCategories||[]).map(c=>`<span class="tg">Cấp độ: ${E(c)}</span>`),...(IM.meta.discoveredTopics||[]).map(t=>`<span class="tg">Chủ đề: ${E(t)}</span>`),...(IM.meta.discoveredClasses||[]).map(c=>`<span class="tg">Lớp: ${E(c)}</span>`)].join(''):'';
 $('#pv').innerHTML=`<div>${J(IM.sh,(x,i)=>`<button class="b ${i==IM.cur?'':'g'}" style="padding:5px 12px;margin:2px" onclick="IM.cur=${i};pv()">${ICO[x.k]} ${E(x.n)} · ${cnt(x)}/${x.rows.length}</button>`)}</div>${tags?`<div style="margin:6px 0">${tags}</div>`:''}<div class="tw"><table><tr>${J(COL[s.k],x=>`<th>${x}</th>`)}<th></th></tr>${J(s.rows,(r,i)=>`<tr class="${okr(s.k,r)?'':'bad'}">${J(r,(x,j)=>`<td><input value="${E(x)}" onchange="IM.sh[IM.cur].rows[${i}][${j}]=this.value.trim();pv()"></td>`)}<td><button class="ic" onclick="IM.sh[IM.cur].rows.splice(${i},1);pv()">✖</button></td></tr>`)}</table></div><button class="b" onclick="cf()">✅ Lưu ${tot} dòng</button>`};
const lv=(x,d='A1')=>L.includes((x||'').toUpperCase())?x.toUpperCase():d;
const mq=(q,o,a,e,tp,l,cl)=>{let j='ABCD'.indexOf(AN(o,a)),op=o.filter(Boolean);return{id:nid(),q,o:op,a:Math.max(0,op.indexOf(o[j])),e,tp:tp||'',l:lv(l,''),cl:cl||''}};
const cf=()=>{let n=0;const clsSet=new Set();
 IM.sh.forEach(({k,rows})=>{let r=rows.filter(x=>okr(k,x));n+=r.length;
  if(k=='vocab')r.forEach(x=>{if(x[5])clsSet.add(x[5]);let o={w:x[0],m:x[1],t:x[2]||'Chung',l:lv(x[3]),ex:x[4],cl:x[5]||''},e=S.vocab.find(a=>a.w.toLowerCase()==o.w.toLowerCase());e?Object.assign(e,o):S.vocab.push({id:nid(),...o})});
  else if(k=='gram')r.forEach(x=>{if(x[5])clsSet.add(x[5]);let o={t:x[0],tp:x[1]||'Chung',l:lv(x[2]),th:x[3],ex:x[4],cl:x[5]||''},e=S.gram.find(a=>a.t.toLowerCase()==o.t.toLowerCase());e?Object.assign(e,o):S.gram.push({id:nid(),...o})});
  else if(k=='qs')r.forEach(x=>{if(x[9])clsSet.add(x[9]);let o=mq(x[0],x.slice(1,5),x[5],x[6],x[7]||'Chung',x[8],x[9]||''),e=S.qs.find(a=>a.q==o.q);e?Object.assign(e,o,{id:e.id}):S.qs.push(o)});
  else{let g={};r.forEach(x=>{(g[x[0]]=g[x[0]]||[]).push(x);if(x[12])clsSet.add(x[12])});Object.entries(g).forEach(([name,rs])=>{let l=lv(rs.find(x=>x[2])?.[2],'');let cl=rs.find(x=>x[12])?.[12]||'';S.tests=S.tests.filter(t=>t.name!=name);S.tests.push({id:nid(),name,l,cl,type:/listen|nghe/i.test(rs.map(x=>x[1]).join(' '))?'Listening':'Reading',min:+(rs.find(x=>x[3])?.[3])||15,text:rs.map(x=>x[4]).find(Boolean)||'',qs:rs.map(x=>mq(x[5],x.slice(6,10),x[10],x[11],'',l,cl))})})}});
 if(!n)return T('Chưa có dòng hợp lệ');if(clsSet.size&&window.SchoolHubAI&&window.SchoolHubAI.syncClassesToHost){window.SchoolHubAI.syncClassesToHost('english',Array.from(clsSet),'excel-import')}save();M();T('Đã lưu '+n+' dòng từ Excel ✨');go(R)};
const tpl=async(mod)=>{try{if(window.SchoolHubAI&&window.SchoolHubAI.downloadSubjectTemplate){await window.SchoolHubAI.downloadSubjectTemplate('english',mod||enModOf(IM?.hint));return}T('Không tìm thấy dịch vụ tải mẫu Excel.')}catch(e){T(e.message||'Không tải được file mẫu')}};
const expEn=async(mod)=>{try{if(!window.SchoolHubAI||!window.SchoolHubAI.exportSubjectExcel)return T('Chưa sẵn sàng xuất Excel.');let records=[];if(mod==='grammar'){records=S.gram.map(x=>({title:x.t,topic:x.tp,level:x.l,theory:x.th,examples:x.ex,className:x.cl||''}))}else if(mod==='tests'){records=S.tests.flatMap(t=>(t.qs||[]).map(q=>({testName:t.name,testType:t.type,level:t.l,minutes:t.min,passage:t.text,question:q.q,optionA:(q.o||[])[0]||'',optionB:(q.o||[])[1]||'',optionC:(q.o||[])[2]||'',optionD:(q.o||[])[3]||'',answer:'ABCD'[q.a]||'A',explain:q.e||'',className:t.cl||''})))}else if(mod==='quiz'){records=S.qs.map(q=>({question:q.q,optionA:(q.o||[])[0]||'',optionB:(q.o||[])[1]||'',optionC:(q.o||[])[2]||'',optionD:(q.o||[])[3]||'',answer:'ABCD'[q.a]||'A',explain:q.e||'',topic:q.tp||'Chung',level:q.l||'B1',className:q.cl||''}))}else{records=S.vocab.map(x=>({word:x.w,meaning:x.m,topic:x.t,level:x.l,example:x.ex,className:x.cl||''}))}await window.SchoolHubAI.exportSubjectExcel('english',mod,records)}catch(e){T(e.message||'Không xuất được file Excel')}};
onkeydown=e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||$('.ov'))return;if(R=='flash'&&e.key==' '){e.preventDefault();$('.fc')?.classList.toggle('f')}if(R=='practice'&&Q&&/^[1-4]$/.test(e.key))document.querySelectorAll('button.o')[e.key-1]?.click()};

if(window.SchoolHubAI){window.SchoolHubAI.onHostCommand(msg=>{if(msg.type==='iframe:navigate'&&msg.view){go(msg.view)}else if(msg.type==='host:inject-quiz'&&msg.payload&&Array.isArray(msg.payload.questions)){msg.payload.questions.forEach(q=>S.qs.unshift({id:nid(),q:q.question,o:q.options||[],a:Math.max(0,Number(q.correctIndex)||0),e:q.explanation||'',tp:q.topic||msg.payload.topic||'Tiếng Anh AI',l:'B1'}));save();T(`Đã nạp ${msg.payload.questions.length} câu hỏi AI!`);go('practice')}else if(msg.type==='host:inject-cards'&&msg.payload&&Array.isArray(msg.payload.cards)){msg.payload.cards.forEach(c=>S.vocab.unshift({id:nid(),w:c.front,m:c.back,t:msg.payload.topic||'Tiếng Anh AI',l:'B1',ex:c.example||''}));save();T(`Đã nạp ${msg.payload.cards.length} từ mới AI!`);go('flash')}})}
U();ub();onhashchange=()=>go(location.hash.slice(1));go(location.hash.slice(1));
