<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MathBuddy – Học Toán</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--b1:#eef3fb;--b2:#eef3fb;--b3:#eef3fb;--c:#ffffff;--t:#1e293b;--m:#64748b;--a:#6366f1;--a2:#4f46e5;--ok:#10b981;--no:#ef4444;--bd:#dbe4f0;--in:#f8fafc;--g:rgba(100,116,139,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#0f172a;--b2:#0f172a;--b3:#0f172a;--c:#1e293b;--t:#f1f5f9;--m:#94a3b8;--bd:#334155;--in:#0f172a;--g:rgba(148,163,184,.2)}}
:root[data-theme="dark"]{--b1:#0f172a;--b2:#0f172a;--b3:#0f172a;--c:#1e293b;--t:#f1f5f9;--m:#94a3b8;--bd:#334155;--in:#0f172a;--g:rgba(148,163,184,.2)}
*{box-sizing:border-box}body{margin:0;font:500 15px/1.5 Nunito,system-ui,sans-serif;color:var(--t);background:var(--b1);min-height:100vh}
main{max-width:1000px;margin:auto;padding:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:8px 10px;background:var(--c);border-bottom:1px solid var(--bd)}
nav button{flex:none;background:transparent;color:var(--t);padding:6px 10px;font-size:13.5px}nav button.on{background:var(--a);color:#fff}
.card{background:var(--c);border:1px solid var(--bd);border-radius:22px;padding:16px;box-shadow:0 4px 16px rgba(15,23,42,.07);margin:0 0 14px;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--in);border:1px solid var(--g);border-radius:14px;padding:8px 12px;max-width:100%}
button{cursor:pointer;background:var(--a);color:#fff;border:0;font-weight:700;transition:transform .15s}button:hover{transform:translateY(-2px) scale(1.03)}button:disabled{opacity:.6}
button.s{background:var(--in);color:var(--t);border:1px solid var(--g)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{font-size:30px;font-weight:800}.mu{color:var(--m)}.chip{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--g)}
canvas{width:100%;height:420px;border-radius:18px;background:var(--in);touch-action:none;display:block}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:5px 8px;border-bottom:1px solid var(--g);text-align:left}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--in);color:var(--t);border:1px solid var(--g)}.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--no);color:#fff}
mjx-container{max-width:100%;overflow-x:auto}details summary{cursor:pointer}pre{margin:0}
</style>
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]},svg:{fontCache:'global'}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script src="/assets/aistudio/subject-ai-bridge.js"></script>
</head><body>
<nav id="nv"></nav><main id="m"></main>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SC={th:['grade','chapter','topic','title','content','className'],fo:['grade','topic','name','latex','explain','example','className'],ex:['grade','topic','level','type','question','options','answer','solution','test','className']},KEY={th:'title',fo:'name',ex:'question'};
const SEED={th:[{grade:'9',chapter:'Phương trình',topic:'Phương trình bậc hai',title:'Công thức nghiệm',content:'Với $ax^2+bx+c=0$ ($a\\neq0$), đặt $\\Delta=b^2-4ac$. Nếu $\\Delta>0$ thì $x_{1,2}=\\frac{-b\\pm\\sqrt{\\Delta}}{2a}$.'}],
fo:[{topic:'Đại số',name:'Hiệu hai bình phương',latex:'a^2-b^2=(a-b)(a+b)',explain:'Hiệu hai bình phương bằng tích của hiệu và tổng.',example:'$99^2-1=98\\cdot100$'},{topic:'Hình học',name:'Định lý Pythagore',latex:'a^2+b^2=c^2',explain:'Tam giác vuông: bình phương cạnh huyền bằng tổng bình phương hai cạnh góc vuông.',example:''}],
ex:[{grade:'9',topic:'Phương trình bậc hai',level:'Dễ',type:'mc',question:'Nghiệm của $x^2-5x+6=0$ là:',options:'1 và 6|2 và 3|-2 và -3|-1 và 6',answer:'B',solution:'$\\Delta=25-24=1$ nên $x=\\frac{5\\pm1}{2}$, tức $x=3$ hoặc $x=2$.',test:'Đề mẫu'},
{grade:'12',topic:'Đạo hàm',level:'Trung bình',type:'fill',question:'Tính đạo hàm của $f(x)=x^3$ tại $x=2$.',options:'',answer:'12',solution:"$f'(x)=3x^2$ nên $f'(2)=12$.",test:'Đề mẫu'},
{grade:'8',topic:'Bất đẳng thức',level:'Khó',type:'essay',question:'Chứng minh $a^2+b^2\\ge 2ab$.',options:'',answer:'Dùng $(a-b)^2\\ge0$',solution:'$a^2+b^2-2ab=(a-b)^2\\ge0$.',test:''}]};
let D;try{D=JSON.parse(localStorage.getItem('mb1'))}catch(e){}
D=D||{...SEED,me:'Bạn',users:{},log:[]};
const save=()=>{try{localStorage.setItem('mb1',JSON.stringify(D))}catch(e){}};
const U=()=>D.users[D.me]||(D.users[D.me]={score:0,done:0,ok:0});
const rec=(ok,topic)=>{const u=U();u.done++;if(ok){u.ok++;u.score+=10}D.log.push({t:Date.now(),topic,ok});D.log=D.log.slice(-300);save()};
const uq=(k,f)=>[...new Set(D[k].map(x=>x[f]).filter(Boolean))];
let cur='home',F={},S=null,TM=0,V={},I={};
const tx=()=>{try{MathJax.typesetPromise&&MathJax.typesetPromise()}catch(e){}};
const fs=(k,l,lab)=>`<select onchange="F.${k}=this.value;go(cur)"><option value="">${lab}</option>${l.map(v=>`<option ${F[k]==v?'selected':''}>${E(v)}</option>`).join('')}</select>`;
const del=async(k,i)=>{if(window.SchoolHubAI&&window.SchoolHubAI.confirmAction){const ok=await window.SchoolHubAI.confirmAction('Xóa mục này?','Xóa');if(!ok)return}D[k].splice(i,1);save();go(cur)};
const resetAll=async()=>{if(window.SchoolHubAI&&window.SchoolHubAI.confirmAction){const ok=await window.SchoolHubAI.confirmAction('Xóa toàn bộ dữ liệu học Toán?','Xóa tất cả');if(!ok)return}try{localStorage.removeItem('mb1')}catch(e){}location.reload()};
const opts=q=>String(q.options||'').split('|').map(s=>s.trim()).filter(Boolean),typ=q=>q.type||(opts(q).length?'mc':'fill');
const pool=t=>D.ex.filter(x=>(!F.g||x.grade==F.g)&&(!F.t||x.topic==F.t)&&(!F.l||x.level==F.l)&&(!F.cl||x.className==F.cl)&&(!t||t(x)));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const norm=s=>String(s).toLowerCase().replace(/\s/g,'').replace(',','.');
const chk=(q,a)=>{if(a==null||a==='')return false;if(typ(q)=='mc')return String(a).toUpperCase()==String(q.answer).trim().toUpperCase();const x=norm(a),y=norm(q.answer);return x==y||(x!==''&&y!==''&&isFinite(x)&&isFinite(y)&&Math.abs(x-y)<1e-6)};
/* ---------- Excel / nhập liệu ---------- */
const mathModOf=k=>k==='ex'?'questions':k==='fo'?'formula':'lessons';
const form=k=>`<details class=card><summary><b>＋ Thêm thủ công / 📥 Excel</b></summary><div class=r style="margin:10px 0"><button class=s onclick="tpl('${k}')">⬇ Tải mẫu (.xlsx)</button><button class=s onclick="expMath('${k}')">📤 Xuất Excel</button><input type=file accept=".xlsx,.xls" onchange="rd('${k}',this)"></div><div id=pv></div><div id=af class=g>${SC[k].map(c=>`<input name=${c} placeholder="${c}">`).join('')}</div><button style="margin-top:8px" onclick="add('${k}')">Lưu</button></details>`;
const notify=(m,err)=>window.SchoolHubAI&&window.SchoolHubAI.notify?window.SchoolHubAI.notify(m,err):void 0;
const add=k=>{const o={};document.querySelectorAll('#af input').forEach(i=>o[i.name]=i.value.trim());if(!o[KEY[k]])return notify('Thiếu nội dung chính',true);if(o.className&&window.SchoolHubAI&&window.SchoolHubAI.syncClassesToHost){window.SchoolHubAI.syncClassesToHost('math',[o.className],'manual-entry')}D[k].push(o);save();go(cur)};
const tpl=async k=>{try{const mod=mathModOf(k);if(window.SchoolHubAI&&window.SchoolHubAI.downloadSubjectTemplate){await window.SchoolHubAI.downloadSubjectTemplate('math',mod);return}notify('Không tải được file mẫu.',true)}catch(e){notify(e.message||'Không tải được file mẫu.',true)}};
const expMath=async k=>{try{if(!window.SchoolHubAI||!window.SchoolHubAI.exportSubjectExcel)return notify('Chưa sẵn sàng xuất Excel.',true);const mod=mathModOf(k);let records=[];if(k==='ex'){records=D.ex.map(x=>({grade:x.grade?('Lớp '+String(x.grade).replace(/^Lớp\s*/i,'')):'Lớp 10',topic:x.topic||'Chung',difficulty:x.level||'Trung bình',qtype:x.type==='mc'?'mcq':x.type==='fill'?'num':(x.type||'mcq'),question:x.question||'',optionA:opts(x)[0]||'',optionB:opts(x)[1]||'',optionC:opts(x)[2]||'',optionD:opts(x)[3]||'',answer:x.answer||'',solution:x.solution||'',className:x.className||''}))}else if(k==='fo'){records=D.fo.map(x=>({grade:x.grade?('Lớp '+String(x.grade).replace(/^Lớp\s*/i,'')):'Lớp 10',topic:x.topic||'Chung',title:x.name||'',formula:x.latex||'',summary:x.explain||'',example:x.example||'',className:x.className||''}))}else{records=D.th.map(x=>({grade:x.grade?('Lớp '+String(x.grade).replace(/^Lớp\s*/i,'')):'Lớp 10',topic:x.topic||'Chung',title:x.title||'',formula:'',summary:x.content||'',className:x.className||''}))}await window.SchoolHubAI.exportSubjectExcel('math',mod,records)}catch(e){notify(e.message||'Không xuất được file Excel.',true)}};
const rd=async(k,i)=>{const f=i.files[0];if(!f)return;try{const mod=mathModOf(k);let rows=[];let tags=[];
 if(window.SchoolHubAI&&window.SchoolHubAI.parseSubjectExcelFile){
  const res=await window.SchoolHubAI.parseSubjectExcelFile('math',mod,f);
  if(res&&Array.isArray(res.rows)&&res.rows.length){
   tags=[...(res.sheetNames||[]).map(s=>'Tab: '+s),...(res.discoveredClasses||[]).map(c=>'Lớp: '+c),...(res.discoveredGrades||[]),...(res.discoveredTopics||[])];
   rows=res.rows.map(r=>{
    const gr=String(r.grade||'').replace(/^Lớp\s*/i,'').trim()||'10';
    if(k==='ex')return[gr,r.topic||'Chung',r.difficulty||'Trung bình',r.qtype==='mcq'?'mc':r.qtype==='num'?'fill':r.qtype||'mc',r.question||'',[r.optionA,r.optionB,r.optionC,r.optionD].filter(Boolean).join('|'),r.answer||'',r.solution||'',r.className?'Lớp '+r.className:'',r.className||''];
    if(k==='fo')return[gr,r.topic||'Chung',r.title||'',r.formula||'',r.summary||'',r.example||'',r.className||''];
    return[gr,r.topic||'Chung',r.topic||'Chung',r.title||'',r.summary||r.formula||'',r.className||''];
   });
  }
 }
 if(!rows.length){
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  wb.SheetNames.forEach(sName=>{
   if(/^(huong_dan|danh_muc)/i.test(sName))return;
   const infG=(sName.match(/(\d{1,2})/)||[])[1]||'';
   const raw=XLSX.utils.sheet_to_json(wb.Sheets[sName],{defval:''});
   raw.forEach(o=>{const n={};Object.keys(o).forEach(h=>n[h.trim().toLowerCase()]=o[h]);const row=SC[k].map(c=>String(n[c]??'').trim());if(!row[0]&&infG)row[0]=infG;if(row.some(Boolean))rows.push(row)});
  });
 }
 $('#pv').innerHTML=`<p><b>Xem trước ${rows.length} dòng</b>${tags.length?' · '+tags.slice(0,8).map(t=>`<span class=chip>${E(t)}</span>`).join(' '):''}</p><div style="overflow:auto;max-height:260px"><table id=pt><tr>${SC[k].map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td contenteditable>${E(v)}</td>`).join('')}</tr>`).join('')}</table></div><button onclick="cf('${k}')">✔ Xác nhận lưu (${rows.length})</button>`}catch(e){notify(e.message||'Không đọc được file Excel',true)}};
const cf=k=>{const rs=[...$('#pt').rows].slice(1).map(tr=>Object.fromEntries(SC[k].map((c,j)=>[c,tr.cells[j].textContent.trim()]))).filter(o=>o[KEY[k]]);if(!rs.length)return notify('Không có dòng hợp lệ — kiểm tra cột dữ liệu',true);const cls=rs.map(o=>o.className).filter(Boolean);if(cls.length&&window.SchoolHubAI&&window.SchoolHubAI.syncClassesToHost){window.SchoolHubAI.syncClassesToHost('math',cls,'excel-import')}D[k].push(...rs);save();notify(`Đã lưu ${rs.length} mục từ Excel`);go(cur)};
/* ---------- Trang chủ ---------- */
V.home=()=>{const u=U(),acc=u.done?Math.round(u.ok/u.done*100):0,days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5).toDateString();return D.log.filter(l=>new Date(l.t).toDateString()==d).length}),mx=Math.max(1,...days);
return `<div class=card><div class=r><span style="font-size:30px">🐱</span><div><div class=big style="font-size:20px">Chào ${E(D.me)}</div><span class=mu>Sẵn sàng luyện Toán hôm nay</span></div><span style="flex:1"></span><input id=nm placeholder="Đổi tên" style="width:140px"><button onclick="D.me=$('#nm').value.trim()||D.me;save();go('home')">Đổi</button></div></div>
<div class=g>${[['⭐',u.score,'Điểm'],['✏️',u.done,'Câu đã làm'],['🎯',acc+'%','Chính xác'],['📚',D.th.length+' / '+D.ex.length+' / '+D.fo.length,'LT / Bài / CT']].map(x=>`<div class=card>${x[0]}<div class=big>${x[1]}</div><span class=mu>${x[2]}</span></div>`).join('')}</div>
<div class=card><b>7 ngày qua</b><div class=r style="align-items:end;height:90px;margin-top:8px;flex-wrap:nowrap">${days.map(n=>`<div title="${n} câu" style="flex:1;height:${8+n/mx*72}px;border-radius:10px;background:var(--a)"></div>`).join('')}</div></div>
<div class=card><b>Hoạt động gần đây</b>${D.log.slice(-5).reverse().map(l=>`<div>${l.ok?'✅':'❌'} ${E(l.topic||'')} <span class=mu>${new Date(l.t).toLocaleString('vi-VN')}</span></div>`).join('')||'<p class=mu>Chưa có hoạt động — vào Luyện tập để bắt đầu.</p>'}</div>
<button class=s onclick="resetAll()">Đặt lại dữ liệu</button>`};
/* ---------- Lý thuyết / Bài tập / Công thức ---------- */
const flt=(k,f)=>D[k].map((x,i)=>[x,i]).filter(([x])=>f(x));
let MATH_EXT={q:'Định lý Pythagore',src:'wiki',loading:false,err:'',wiki:null,papers:[]};
const searchMathRef=async(src,preset)=>{const inp=$('#math_ext_q');const q=String(preset!==undefined?preset:(inp?inp.value:MATH_EXT.q)).trim();if(!q)return notify('Nhập tên định lý hoặc chủ đề Toán.',true);const useSrc=src||MATH_EXT.src||'wiki';MATH_EXT={q,src:useSrc,loading:true,err:'',wiki:null,papers:[]};go('th');try{if(useSrc==='arxiv'||useSrc==='crossref'){const r=await fetch(`/api/library/academic-search?q=${encodeURIComponent(q)}&source=${encodeURIComponent(useSrc)}`);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Lỗi tra cứu tài liệu học thuật.');MATH_EXT.papers=Array.isArray(d.results)?d.results:(Array.isArray(d.papers)?d.papers:[]);if(!MATH_EXT.papers.length)MATH_EXT.err='Không tìm thấy bài báo phù hợp.'}else{const r=await fetch(`/api/external/wikipedia?q=${encodeURIComponent(q)}&lang=vi&context=math`);const d=await r.json().catch(()=>({}));if(!r.ok||!d.summary)throw new Error(d.error||'Không tìm thấy bài Wikipedia.');MATH_EXT.wiki=d.summary}}catch(e){MATH_EXT.err=e?.message||'Không thể kết nối nguồn tham khảo.'}finally{MATH_EXT.loading=false;go('th')}};
const saveMathWikiToTh=()=>{const w=MATH_EXT.wiki;if(!w)return;D.th.unshift({grade:'10',chapter:'Tham khảo mở',topic:'Wikipedia Toán học',title:w.title,content:w.extract+(w.pageUrl?`\n\nNguồn: ${w.pageUrl}`:'')});save();notify(`Đã lưu "${w.title}" vào Lý thuyết Toán!`);go('th')};
const saveMathArxivToTh=idx=>{const p=MATH_EXT.papers[idx];if(!p)return;const auth=p.authorText||p.authorsText||(Array.isArray(p.authors)?p.authors.join(', '):'');const yr=p.publishedYear||p.year||'';D.th.unshift({grade:'12',chapter:'Nghiên cứu Toán',topic:p.source==='crossref'?'Crossref Journal':'arXiv Paper',title:p.title,content:`${auth}${yr?` (${yr})`:''}\n\n${p.abstract}\n\nLink: ${p.url}`});save();notify(`Đã lưu "${p.title.slice(0,40)}..." vào Lý thuyết Toán!`);go('th')};
V.th=()=>`<div class=r style="margin-bottom:12px">${fs('g',uq('th','grade'),'Lớp/Khối')}${fs('t',uq('th','topic'),'Chủ đề')}${uq('th','className').length?fs('cl',uq('th','className'),'Lớp học'):''}<button class=s onclick="expMath('th')">📤 Xuất Excel</button></div>${form('th')}`+`<details class=card open><summary><b>🎓 Tham khảo Định lý &amp; Bài báo (Wikipedia / arXiv / Crossref)</b></summary><div class=r style="margin-top:10px"><input id=math_ext_q value="${E(MATH_EXT.q)}" placeholder="Tên định lý / chủ đề (vd: Định lý Pythagore, Calculus, Number Theory)..." style="flex:1;min-width:200px" onkeydown="if(event.key==='Enter')searchMathRef(MATH_EXT.src)"><button class="${MATH_EXT.src==='wiki'?'':'s'}" onclick="searchMathRef('wiki')">📖 Wikipedia (VI)</button><button class="${MATH_EXT.src==='arxiv'?'':'s'}" onclick="searchMathRef('arxiv')">📄 arXiv (EN)</button><button class="${MATH_EXT.src==='crossref'?'':'s'}" onclick="searchMathRef('crossref')">📚 Crossref</button></div><div class=r style="margin-top:8px">${['Định lý Pythagore','Phương trình bậc hai','Giải tích','Fibonacci','Number Theory'].map(p=>`<button class=s style="padding:4px 10px;font-size:12px" onclick="searchMathRef(${/^[A-Za-z\s]+$/.test(p)?"'arxiv'":"'wiki'"},'${p}')">${p}</button>`).join('')}</div><div style="margin-top:10px">${MATH_EXT.loading?'<span class=mu>⏳ Đang tra cứu tư liệu Toán học...</span>':MATH_EXT.err?`<div class=r><span style="color:var(--no)">⚠ ${E(MATH_EXT.err)}</span><button class=s onclick="searchMathRef(MATH_EXT.src)">🔄 Thử lại</button></div>`:MATH_EXT.wiki?`<div class=card style="margin:0"><div class=r style="justify-content:space-between;gap:6px"><div><b>${E(MATH_EXT.wiki.title)}</b>${MATH_EXT.wiki.description?`<div class=mu style="font-size:12px">${E(MATH_EXT.wiki.description)}</div>`:''}</div><div class=r><button onclick="saveMathWikiToTh()">＋ Lưu vào Lý thuyết Toán</button><a class="s" href="${E(MATH_EXT.wiki.pageUrl)}" target="_blank" rel="noopener noreferrer" style="padding:6px 10p
