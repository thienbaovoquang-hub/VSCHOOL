        options: Array.isArray(q.options) ? q.options : [],
        correctIndex: Math.max(0, Number(q.correctIndex) || 0),
        methodGuide: 'Đọc kỹ từ khóa địa lý và đối chiếu Atlat/số liệu liên quan.',
        explanation: q.explanation || '',
      });
    });
    logActivity('Sinh câu hỏi Địa lý bằng AI', `${qs.length} câu (${topic})`);
    saveState();
    renderPractice();
    toast(`Đã tạo ${qs.length} câu hỏi Địa lý bằng AI!`);
  } catch (e) {
    toast('Lỗi AI: ' + (e.message || 'Không tạo được câu hỏi.'));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '✨ Sinh câu hỏi AI'; }
  }
}

async function sendGeoAi() {
  const inp = document.getElementById('ai-prompt-inp');
  const prompt = (inp ? inp.value : ui.aiPrompt).trim();
  if (!prompt && !ui.aiImage) { toast('Nhập câu hỏi hoặc đính kèm ảnh.'); return; }
  const userText = prompt || 'Hãy phân tích ảnh bản đồ / Atlat / biểu đồ đính kèm.';
  ui.aiPrompt = '';
  const cleanMsgs = ui.aiMessages.filter((m) => !m.isError).slice(-9).map((m) => ({ role: m.role, content: m.content }));
  cleanMsgs.push({ role: 'user', content: userText });

  ui.aiMessages.push({ role: 'user', content: userText });
  const assistantMsg = { role: 'assistant', content: 'Đang phân tích bằng Gemini AI...' };
  ui.aiMessages.push(assistantMsg);
  const assistantIdx = ui.aiMessages.length - 1;
  ui.aiBusy = true;
  renderAi();

  const imgToSend = ui.aiImage;
  try {
    let replyText = '';
    if (window.SchoolHubAI && window.SchoolHubAI.streamAssist) {
      replyText = await window.SchoolHubAI.streamAssist({
        subjectId: 'geography',
        mode: ui.aiMode,
        prompt: userText,
        messages: cleanMsgs,
        contextText: buildLinkedAiContext(),
        image: imgToSend,
        onDelta: (_d, full) => {
          ui.aiMessages[assistantIdx].content = full;
          const msgsBox = document.getElementById('ai-msgs');
          const bubbles = msgsBox ? msgsBox.querySelectorAll('.msg-bubble') : null;
          const lastBubble = bubbles && bubbles.length ? bubbles[bubbles.length - 1] : null;
          if (lastBubble) {
            lastBubble.innerHTML = renderMarkdownLite(full);
            msgsBox.scrollTop = msgsBox.scrollHeight;
          }
        },
      });
    } else {
      const res = await fetch('/api/ai/subject-assist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          subjectId: 'geography',
          mode: ui.aiMode,
          prompt: userText,
          messages: cleanMsgs,
          contextText: buildLinkedAiContext(),
          image: imgToSend,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Lỗi dịch vụ AI.');
      replyText = data.text || '';
    }
    ui.aiMessages[assistantIdx].content = replyText;
  } catch (e) {
    ui.aiMessages[assistantIdx] = {
      role: 'assistant',
      content: `⚠ Không thể phản hồi lúc này: ${e.message}`,
      isError: true,
    };
  } finally {
    ui.aiBusy = false;
    renderAi();
  }
}

// ===================== EXCEL IMPORT MODAL (ALL 5 MODULES) =====================
function openExcelModal(mod) {
  ui.excelPreview = { moduleKey: mod || 'knowledge', rows: [], dataset: null };
  renderExcelModal();
}

function renderExcelModal() {
  const { moduleKey, rows, dataset } = ui.excelPreview;
  const count = moduleKey === 'data' ? (dataset ? dataset.rows.length : 0) : rows.length;

  let previewHtml = `<div class="meta-line">Chọn file Excel (.xlsx, .xls) để tự động đọc, phân loại, xem trước và chỉnh sửa trước khi lưu.</div>`;
  if (moduleKey === 'data' && dataset) {
    previewHtml = `
      <div class="grid-2">
        <div><label class="lbl">Tên bảng số liệu</label><input value="${esc(dataset.title)}" onchange="ui.excelPreview.dataset.title=this.value" /></div>
        <div><label class="lbl">Đơn vị</label><input value="${esc(dataset.unit)}" onchange="ui.excelPreview.dataset.unit=this.value" /></div>
      </div>
      <div class="data-grid-wrap" style="max-height:240px;">
        <table class="geo-table">
          <thead><tr><th>Đối tượng</th>${dataset.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>
            ${dataset.rows.map((r, ri) => `
              <tr>
                <td><input value="${esc(r.label)}" onchange="ui.excelPreview.dataset.rows[${ri}].label=this.value" /></td>
                ${r.values.map((v, ci) => `<td><input class="mono" type="number" step="any" value="${v ?? ''}" onchange="ui.excelPreview.dataset.rows[${ri}].values[${ci}]=this.value===''?null:Number(this.value)" /></td>`).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } else if (rows.length > 0) {
    previewHtml = `
      <div class="meta-line"><strong>Xem trước &amp; chỉnh sửa (${rows.length} dòng) trước khi lưu:</strong></div>
      <div class="data-grid-wrap" style="max-height:240px;">
        <table class="geo-table">
          <thead><tr><th>#</th><th>Tên / Câu hỏi</th><th>Phân loại / Tọa độ</th><th>Chủ đề / Nguồn</th><th></th></tr></thead>
          <tbody>
            ${rows.map((r, i) => `
              <tr>
                <td class="mono">${i + 1}</td>
                <td><input value="${esc(r.title || r.name || r.prompt || '')}" onchange="updateXlCell(${i},'${r.name!==undefined?'name':r.prompt!==undefined?'prompt':'title'}',this.value)" /></td>
                <td><input value="${esc(r.domain || r.layer || r.type || '')}" onchange="updateXlCell(${i},'${r.layer!==undefined?'layer':r.type!==undefined?'type':'domain'}',this.value)" /></td>
                <td><input value="${esc(r.topic || r.region || r.source || '')}" onchange="updateXlCell(${i},'${r.region!==undefined?'region':'topic'}',this.value)" /></td>
                <td><button type="button" class="btn btn-xs" onclick="ui.excelPreview.rows.splice(${i},1);renderExcelModal()">×</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  openModal(
    'Nhập dữ liệu Excel (.xlsx, .xls)',
    `
      <div class="grid-2" style="align-items:end;">
        <div>
          <label class="lbl">Mục nhận dữ liệu</label>
          <select onchange="ui.excelPreview.moduleKey=this.value;ui.excelPreview.rows=[];ui.excelPreview.dataset=null;renderExcelModal()">
            <option value="knowledge" ${moduleKey==='knowledge'?'selected':''}>Kiến thức Địa lý</option>
            <option value="atlas" ${moduleKey==='atlas'?'selected':''}>Atlat (Địa danh &amp; Tọa độ)</option>
            <option value="data" ${moduleKey==='data'?'selected':''}>Dữ liệu &amp; Biểu đồ</option>
            <option value="practice" ${moduleKey==='practice'?'selected':''}>Luyện tập (Câu hỏi)</option>
            <option value="test" ${moduleKey==='test'?'selected':''}>Kiểm tra (Ngân hàng đề)</option>
          </select>
        </div>
        <div>
          <a class="btn btn-sand" style="text-decoration:none;justify-content:center;width:100%;" href="/api/geography/excel-template?module=${esc(moduleKey)}" download>Tải file Excel mẫu (.xlsx)</a>
        </div>
      </div>

      <div>
        <label class="lbl">Tải lên file Excel (.xlsx, .xls)</label>
        <input type="file" accept=".xlsx,.xls" onchange="handleExcelUpload(this)" />
      </div>

      ${previewHtml}
    `,
    `<button type="button" class="btn" onclick="closeModal()">Đóng</button><button type="button" class="btn btn-ocean" ${count === 0 ? 'disabled' : ''} onclick="confirmSaveExcel()">Xác nhận lưu (${count})</button>`
  );
}

function updateXlCell(idx, field, val) {
  if (ui.excelPreview.rows[idx]) ui.excelPreview.rows[idx][field] = val;
}

async function handleExcelUpload(input) {
  const file = input.files?.[0];
  if (!file) return;
  try {
    const dataUrl = await readFileDataUrl(file);
    const res = await fetch('/api/geography/parse-excel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileName: file.name, moduleKey: ui.excelPreview.moduleKey, fileBase64: dataUrl, title: file.name.replace(/\.xlsx?$/i, '') }),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Không đọc được file Excel.');
    if (ui.excelPreview.moduleKey === 'data') {
      ui.excelPreview.dataset = d.dataset || null;
      ui.excelPreview.rows = [];
    } else {
      ui.excelPreview.rows = d.rows || [];
      ui.excelPreview.dataset = null;
    }
    renderExcelModal();
    toast('Đã đọc dữ liệu xem trước từ Excel.');
  } catch (e) { toast(e.message); }
}

function confirmSaveExcel() {
  const { moduleKey, rows, dataset } = ui.excelPreview;
  if (moduleKey === 'data' && dataset) {
    state.datasets.unshift(dataset);
    ui.selectedDatasetId = dataset.id;
    logActivity('Nhập bảng số liệu Excel', dataset.title);
    saveState();
    closeModal();
    switchView('data');
    toast(`Đã lưu bảng số liệu "${dataset.title}".`);
    return;
  }
  if (!rows.length) return;
  if (moduleKey === 'knowledge') {
    state.lessons = [...rows, ...state.lessons];
  } else if (moduleKey === 'atlas') {
    state.atlasFeatures = [...rows, ...state.atlasFeatures];
  } else if (moduleKey === 'practice' || moduleKey === 'test') {
    state.questions = [...rows, ...state.questions];
  }
  logActivity(`Nhập Excel (${moduleKey})`, `${rows.length} dòng`);
  saveState();
  closeModal();
  switchView(moduleKey);
  toast(`Đã nhập ${rows.length} mục từ Excel.`);
}

// Host Bridge Commands
if (window.SchoolHubAI) {
  window.SchoolHubAI.onHostCommand((msg) => {
    if (msg.type === 'host:inject-quiz' && msg.payload && Array.isArray(msg.payload.questions)) {
      msg.payload.questions.forEach((q, idx) => {
        state.questions.unshift({
          id: uid('gq_host_' + idx),
          type: 'mcq',
          grade: 'Lớp 12',
          chapter: 'Ôn tập AI',
          topic: q.topic || msg.payload.topic || 'Địa lý AI',
          prompt: q.question,
          options: Array.isArray(q.options) ? q.options : [],
          correctIndex: Math.max(0, Number(q.correctIndex) || 0),
          methodGuide: 'Đối chiếu Atlat và kiến thức Địa lý trọng tâm.',
          explanation: q.explanation || '',
        });
      });
      saveState();
      switchView('practice');
      toast(`Đã nạp ${msg.payload.questions.length} câu hỏi AI vào Luyện tập.`);
    } else if (msg.type === 'host:inject-cards' && msg.payload && Array.isArray(msg.payload.cards)) {
      msg.payload.cards.forEach((c, idx) => {
        state.lessons.unshift({
          id: uid('gl_host_' + idx),
          title: c.front,
          grade: 'Lớp 12',
          chapter: 'Ghi nhớ nhanh AI',
          topic: msg.payload.topic || 'Địa lý AI',
          domain: 'Tự nhiên',
          summary: c.back,
          keyPoints: c.example || '',
          dataNotes: c.tip || '',
          yearRef: '',
          source: 'Gemini AI',
        });
      });
      saveState();
      switchView('knowledge');
      toast(`Đã nạp ${msg.payload.cards.length} thẻ kiến thức AI.`);
    }
  });
}

// Init
renderCurrentView();
emitGeoContext(ui.view);
</script>
