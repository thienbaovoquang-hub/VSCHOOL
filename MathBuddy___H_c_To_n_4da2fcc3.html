<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MathBuddy – Học Toán</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--b1:#ffe3f1;--b2:#e3ecff;--b3:#e2fff0;--c:rgba(255,255,255,.65);--t:#3b3558;--m:#7a7499;--a:#8b7bff;--a2:#ff8fb8;--ok:#2fb47c;--no:#e75a70;--bd:rgba(255,255,255,.9);--in:rgba(255,255,255,.85);--g:rgba(120,110,170,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--b1:#2b2040;--b2:#1b2542;--b3:#1a3336;--c:rgba(44,40,78,.62);--t:#f0ecff;--m:#b0a9d6;--bd:rgba(255,255,255,.12);--in:rgba(30,28,56,.8);--g:rgba(200,190,255,.15)}}
*{box-sizing:border-box}body{margin:0;font:500 15px/1.5 Nunito,system-ui,sans-serif;color:var(--t);background:linear-gradient(135deg,var(--b1),var(--b2) 55%,var(--b3)) fixed;min-height:100vh}
main{max-width:1000px;margin:auto;padding:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--c);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
nav button{flex:none;background:transparent;color:var(--t);padding:6px 12px}nav button.on{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff}
.card{background:var(--c);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:22px;padding:16px;box-shadow:0 8px 28px var(--g);margin:0 0 14px;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--in);border:1px solid var(--g);border-radius:14px;padding:8px 12px;max-width:100%}
button{cursor:pointer;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border:0;font-weight:700;transition:transform .15s}button:hover{transform:translateY(-2px) scale(1.03)}button:disabled{opacity:.6}
button.s{background:var(--in);color:var(--t);border:1px solid var(--g)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{font-size:30px;font-weight:800}.mu{color:var(--m)}.chip{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--g)}
canvas{width:100%;height:420px;border-radius:18px;background:var(--in);touch-action:none;display:block}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:5px 8px;border-bottom:1px solid var(--g);text-align:left}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--in);color:var(--t);border:1px solid var(--g)}.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--no);color:#fff}
mjx-container{max-width:100%;overflow-x:auto}details summary{cursor:pointer}pre{margin:0}
</style>
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]},svg:{fontCache:'global'}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script src="/assets/aistudio/subject-ai-bridge.js"></script>
</head><body>
<nav id="nv"></nav><main id="m"></main>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SC={th:['grade','chapter','topic','title','content'],fo:['topic','name','latex','explain','example'],ex:['grade','topic','level','type','question','options','answer','solution','test']},KEY={th:'title',fo:'name',ex:'question'};
const SEED={th:[{grade:'9',chapter:'Phương trình',topic:'Phương trình bậc hai',title:'Công thức nghiệm',content:'Với $ax^2+bx+c=0$ ($a\\neq0$), đặt $\\Delta=b^2-4ac$. Nếu $\\Delta>0$ thì $x_{1,2}=\\frac{-b\\pm\\sqrt{\\Delta}}{2a}$.'}],
fo:[{topic:'Đại số',name:'Hiệu hai bình phương',latex:'a^2-b^2=(a-b)(a+b)',explain:'Hiệu hai bình phương bằng tích của hiệu và tổng.',example:'$99^2-1=98\\cdot100$'},{topic:'Hình học',name:'Định lý Pythagore',latex:'a^2+b^2=c^2',explain:'Tam giác vuông: bình phương cạnh huyền bằng tổng bình phương hai cạnh góc vuông.',example:''}],
ex:[{grade:'9',topic:'Phương trình bậc hai',level:'Dễ',type:'mc',question:'Nghiệm của $x^2-5x+6=0$ là:',options:'1 và 6|2 và 3|-2 và -3|-1 và 6',answer:'B',solution:'$\\Delta=25-24=1$ nên $x=\\frac{5\\pm1}{2}$, tức $x=3$ hoặc $x=2$.',test:'Đề mẫu'},
{grade:'12',topic:'Đạo hàm',level:'Trung bình',type:'fill',question:'Tính đạo hàm của $f(x)=x^3$ tại $x=2$.',options:'',answer:'12',solution:"$f'(x)=3x^2$ nên $f'(2)=12$.",test:'Đề mẫu'},
{grade:'8',topic:'Bất đẳng thức',level:'Khó',type:'essay',question:'Chứng minh $a^2+b^2\\ge 2ab$.',options:'',answer:'Dùng $(a-b)^2\\ge0$',solution:'$a^2+b^2-2ab=(a-b)^2\\ge0$.',test:''}]};
let D;try{D=JSON.parse(localStorage.getItem('mb1'))}catch(e){}
D=D||{...SEED,me:'Bạn',users:{},log:[]};
const save=()=>{try{localStorage.setItem('mb1',JSON.stringify(D))}catch(e){}};
const U=()=>D.users[D.me]||(D.users[D.me]={score:0,done:0,ok:0});
const rec=(ok,topic)=>{const u=U();u.done++;if(ok){u.ok++;u.score+=10}D.log.push({t:Date.now(),topic,ok});D.log=D.log.slice(-300);save()};
const uq=(k,f)=>[...new Set(D[k].map(x=>x[f]).filter(Boolean))];
let cur='home',F={},S=null,TM=0,V={},I={};
const tx=()=>{try{MathJax.typesetPromise&&MathJax.typesetPromise()}catch(e){}};
const fs=(k,l,lab)=>`<select onchange="F.${k}=this.value;go(cur)"><option value="">${lab}</option>${l.map(v=>`<option ${F[k]==v?'selected':''}>${E(v)}</option>`).join('')}</select>`;
const del=(k,i)=>{if(confirm('Xóa mục này?')){D[k].splice(i,1);save();go(cur)}};
const opts=q=>String(q.options||'').split('|').map(s=>s.trim()).filter(Boolean),typ=q=>q.type||(opts(q).length?'mc':'fill');
const pool=t=>D.ex.filter(x=>(!F.g||x.grade==F.g)&&(!F.t||x.topic==F.t)&&(!F.l||x.level==F.l)&&(!t||t(x)));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const norm=s=>String(s).toLowerCase().replace(/\s/g,'').replace(',','.');
const chk=(q,a)=>{if(a==null||a==='')return false;if(typ(q)=='mc')return String(a).toUpperCase()==String(q.answer).trim().toUpperCase();const x=norm(a),y=norm(q.answer);return x==y||(x!==''&&y!==''&&isFinite(x)&&isFinite(y)&&Math.abs(x-y)<1e-6)};
/* ---------- Excel / nhập liệu ---------- */
const form=k=>`<details class=card><summary><b>＋ Thêm thủ công / 📥 Nhập Excel</b></summary><div class=r style="margin:10px 0"><button class=s onclick="tpl('${k}')">⬇ File mẫu</button><input type=file accept=".xlsx,.xls" onchange="rd('${k}',this)"></div><div id=pv></div>${k=='ex'?'<p class=mu>type: mc | fill | essay · options: A|B|C|D (ngăn bằng |) · answer: chữ cái A-D (mc) hoặc đáp số · test: tên đề (dùng ở mục Test)</p>':''}<div id=af class=g>${SC[k].map(c=>`<input name=${c} placeholder="${c}">`).join('')}</div><button style="margin-top:8px" onclick="add('${k}')">Lưu</button></details>`;
const add=k=>{const o={};document.querySelectorAll('#af input').forEach(i=>o[i.name]=i.value.trim());if(!o[KEY[k]])return alert('Thiếu nội dung chính');D[k].push(o);save();go(cur)};
const tpl=async k=>{const d=window.claude&&await claude.use('downloads');if(!d)return alert('Không tải được file ở chế độ xem này');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([SC[k],SC[k].map(c=>SEED[k][0][c]||'')]),k);try{await d.save({filename:'mau-'+k+'.xlsx',data:XLSX.write(wb,{type:'array',bookType:'xlsx'})})}catch(e){}};
const rd=(k,i)=>{const f=i.files[0];if(!f)return;const r=new FileReader;r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}).map(o=>{const n={};Object.keys(o).forEach(h=>n[h.trim().toLowerCase()]=o[h]);return SC[k].map(c=>n[c]??'')});
$('#pv').innerHTML=`<p><b>Xem trước ${rows.length} dòng</b> — bấm vào ô để sửa</p><div style="overflow:auto;max-height:260px"><table id=pt><tr>${SC[k].map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td contenteditable>${E(v)}</td>`).join('')}</tr>`).join('')}</table></div><button onclick="cf('${k}')">✔ Xác nhận lưu</button>`};r.readAsArrayBuffer(f)};
const cf=k=>{const rs=[...$('#pt').rows].slice(1).map(tr=>Object.fromEntries(SC[k].map((c,j)=>[c,tr.cells[j].textContent.trim()]))).filter(o=>o[KEY[k]]);if(!rs.length)return alert('Không có dòng hợp lệ — kiểm tra tên cột theo file mẫu');D[k].push(...rs);save();go(cur)};
/* ---------- Home ---------- */
V.home=()=>{const u=U(),acc=u.done?Math.round(u.ok/u.done*100):0,days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5).toDateString();return D.log.filter(l=>new Date(l.t).toDateString()==d).length}),mx=Math.max(1,...days);
return `<div class=card><div class=r><span style="font-size:34px">🐱</span><div><div class=big style="font-size:22px">Chào ${E(D.me)}!</div><span class=mu>Hôm nay học gì nhỉ?</span></div><span style="flex:1"></span><input id=nm placeholder="Đổi tên người học" style="width:160px"><button onclick="D.me=$('#nm').value.trim()||D.me;save();go('home')">Đổi</button></div></div>
<div class=g>${[['⭐',u.score,'Điểm'],['✏️',u.done,'Câu đã làm'],['🎯',acc+'%','Chính xác'],['📚',D.th.length+' / '+D.ex.length+' / '+D.fo.length,'LT / Bài / CT']].map(x=>`<div class=card>${x[0]}<div class=big>${x[1]}</div><span class=mu>${x[2]}</span></div>`).join('')}</div>
<div class=card><b>7 ngày qua</b><div class=r style="align-items:end;height:100px;margin-top:8px;flex-wrap:nowrap">${days.map(n=>`<div title="${n} câu" style="flex:1;height:${8+n/mx*80}px;border-radius:10px;background:linear-gradient(var(--a),var(--a2))"></div>`).join('')}</div></div>
<div class=card><b>Hoạt động gần đây</b>${D.log.slice(-5).reverse().map(l=>`<div>${l.ok?'✅':'❌'} ${E(l.topic||'')} <span class=mu>${new Date(l.t).toLocaleString('vi-VN')}</span></div>`).join('')||'<p class=mu>Chưa có hoạt động — vào Practice để bắt đầu.</p>'}</div>
<button class=s onclick="if(confirm('Xóa toàn bộ dữ liệu?')){try{localStorage.removeItem('mb1')}catch(e){}location.reload()}">Xóa dữ liệu</button>`};
/* ---------- Theory / Exercises / Formula ---------- */
const flt=(k,f)=>D[k].map((x,i)=>[x,i]).filter(([x])=>f(x));
V.th=()=>`<div class=r style="margin-bottom:12px">${fs('g',uq('th','grade'),'Lớp')}${fs('t',uq('th','topic'),'Chủ đề')}</div>${form('th')}`+(flt('th',x=>(!F.g||x.grade==F.g)&&(!F.t||x.topic==F.t)).map(([x,i])=>`<div class=card><div class=r><span class=chip>Lớp ${E(x.grade)}</span><span class=chip>${E(x.chapter)}</span><span class=chip>${E(x.topic)}</span><span style="flex:1"></span><button class=s onclick="del('th',${i})">🗑</button></div><h3>${E(x.title)}</h3><div style="white-space:pre-wrap">${E(x.content)}</div></div>`).join('')||'<p class=mu>Chưa có nội dung.</p>');
const aiBoxHtml=(id)=>`<div id="${id}" class="card" style="display:none;margin-top:8px;white-space:pre-wrap"></div>`;
const AI_PROMPTS={};
const mathAiBtn=(id,label,prompt)=>{AI_PROMPTS[id]=prompt;return `<button class=s onclick="explainMath('${id}')">${label}</button>`};
const explainMath=async(id,directPrompt)=>{const prompt=directPrompt||AI_PROMPTS[id];const b=$('#'+id);if(!b||!prompt||!window.SchoolHubAI)return;b.style.display='block';b.innerHTML='<span class=mu>Gemini đang giải thích từng bước...</span>';try{await window.SchoolHubAI.streamAssist({subjectId:'math',mode:'wrong_answer_coach',prompt,onDelta:(_d,full)=>{b.innerHTML=window.SchoolHubAI.renderMarkdown(full)}});tx()}catch(e){b.innerHTML=`<span style="color:var(--no)">⚠ ${E(e.message||'Không gọi được AI')}</span>`}};
const genMathExAI=async(targetView)=>{if(!window.SchoolHubAI)return;const tp=F.t||prompt('Nhập chủ đề Toán muốn AI tạo bài tập (vd: Phương trình bậc 2, Đạo hàm, Hình học không gian):','Phương trình bậc 2 & Hàm số');if(!tp)return;const btn=$('#btn_m_aiq');if(btn){btn.disabled=true;btn.textContent='⏳ Đang tạo đề...'}try{const res=await window.SchoolHubAI.generateQuiz({subjectId:'math',topic:tp+(F.g?' lớp '+F.g:''),count:4});const qs=Array.isArray(res.questions)?res.questions:[];if(!qs.length)return alert('AI chưa tạo được bài tập.');qs.forEach(q=>D.ex.unshift({grade:F.g||'10',topic:tp,level:F.l||'Trung bình',type:'mc',question:q.question,options:(q.options||[]).join('|'),answer:'ABCD'[Number(q.correctIndex)||0]||'A',solution:q.explanation||'',test:'Đề AI'}));save();go(targetView||cur)}catch(e){alert('Lỗi AI: '+(e.message||'Không thể sinh bài tập'))}finally{if(btn){btn.disabled=false;btn.textContent='✨ Sinh bài tập AI'}}};
V.ex=()=>`<div class=r style="margin-bottom:12px">${fs('g',uq('ex','grade'),'Lớp')}${fs('t',uq('ex','topic'),'Chủ đề')}${fs('l',uq('ex','level'),'Mức độ')}<button id=btn_m_aiq onclick="genMathExAI('ex')">✨ Sinh bài tập AI</button></div>${form('ex')}`+(flt('ex',x=>(!F.g||x.grade==F.g)&&(!F.t||x.topic==F.t)&&(!F.l||x.level==F.l)).map(([x,i])=>`<div class=card><div class=r><span class=chip>Lớp ${E(x.grade)}</span><span class=chip>${E(x.topic)}</span><span class=chip>${E(x.level)}</span><span style="flex:1"></span><button class=s onclick="del('ex',${i})">🗑</button></div><p>${E(x.question)}</p>${typ(x)=='mc'?opts(x).map((o,j)=>`<div>${'ABCD'[j]}. ${E(o)}</div>`).join(''):''}<div class=r><details style="flex:1"><summary><b>Đáp án và lời giải</b></summary><p><b>Đáp án:</b> ${E(x.answer)}</p><div style="white-space:pre-wrap">${E(x.solution)}</div></details>${mathAiBtn('exai_'+i,'🤖 AI phân tích',`Giải thích chi tiết từng bước bài Toán:\n${x.question}\nĐáp án: ${x.answer}\nLời giải tóm tắt: ${x.solution}`)}</div>${aiBoxHtml('exai_'+i)}</div>`).join('')||'<p class=mu>Chưa có bài tập.</p>');
V.fo=()=>`<div class=r style="margin-bottom:12px">${fs('t',uq('fo','topic'),'Chủ đề')}</div>${form('fo')}`+flt('fo',x=>!F.t||x.topic==F.t).map(([x,i])=>`<div class=card><div class=r><span class=chip>${E(x.topic)}</span><b>${E(x.name)}</b><span style="flex:1"></span>${mathAiBtn('foai_'+i,'🤖 AI giải thích',`Giải thích ý nghĩa, điều kiện áp dụng và cho 2 ví dụ minh họa của công thức: ${x.name} (${x.latex})`)}<button class=s onclick="del('fo',${i})">🗑</button></div><div style="font-size:18px;overflow-x:auto">$$${E(x.latex)}$$</div><p>${E(x.explain)}</p>${x.example?`<p class=mu>Ví dụ: ${E(x.example)}</p>`:''}${aiBoxHtml('foai_'+i)}</div>`).join('');
/* ---------- Practice ---------- */
const startP=()=>{const q=shuf(pool());if(!q.length)return alert('Không có bài phù hợp — thêm ở Exercises');S={mode:'p',q,i:0,ok:0,a:null};go('pr')};
const ans=a=>{const q=S.q[S.i];S.a=a;S.r=typ(q)=='essay'?null:chk(q,a);if(S.r!==null){rec(S.r,q.topic);if(S.r)S.ok++}go('pr')};
const ansI=()=>ans($('#fa').value),mark=v=>{rec(!!v,S.q[S.i].topic);if(v)S.ok++;S.r=!!v;go('pr')};
V.pr=()=>{if(!S||S.mode!='p')return `<div class=card><h3>Luyện tập 🎯</h3><div class=r>${fs('g',uq('ex','grade'),'Lớp')}${fs('t',uq('ex','topic'),'Chủ đề')}${fs('l',uq('ex','level'),'Mức độ')}</div><p class=mu>${pool().length} bài phù hợp (lấy từ Exercises)</p><div class=r><button onclick="startP()">Bắt đầu</button><button id=btn_m_aiq class=s onclick="genMathExAI('pr')">✨ Sinh bài tập AI</button></div></div>`;
if(S.i>=S.q.length)return `<div class=card><h3>Hoàn thành! 🎉</h3><p>Đúng ${S.ok}/${S.q.length} câu</p><button onclick="S=null;go('pr')">Luyện tiếp</button></div>`;
const q=S.q[S.i],t=typ(q),d=S.a!=null;
return `<div class=card><div class=r><span class=chip>Câu ${S.i+1}/${S.q.length}</span><span class=chip>${E(q.topic)}</span></div><p style="font-size:17px">${E(q.question)}</p>
${t=='mc'?opts(q).map((o,j)=>{const L='ABCD'[j];return `<button class="opt ${d&&L==String(q.answer).trim().toUpperCase()?'ok':d&&S.a==L?'no':''}" ${d?'disabled':''} onclick="ans('${L}')">${L}. ${E(o)}</button>`}).join(''):`<div class=r>${t=='essay'?'<textarea id=fa rows=3 style="flex:1" placeholder="Bài làm của bạn"></textarea>':'<input id=fa style="flex:1" placeholder="Nhập đáp án">'}${d?'':`<button onclick="ansI()">${t=='essay'?'Xem lời giải':'Chấm'}</button>`}</div>`}
${d?`<div class=card style="margin-top:10px"><b>${S.r===true?'✅ Chính xác!':S.r===false?'❌ Chưa đúng — đáp án: '+E(q.answer):'Đáp án gợi ý: '+E(q.answer)}</b><div style="white-space:pre-wrap;margin-top:6px">${E(q.solution)}</div><div class=r style="margin-top:8px">${S.r===null?`<button onclick="mark(1)">Tôi làm đúng</button><button class=s onclick="mark(0)">Chưa đúng</button>`:`<button onclick="S.i++;S.a=null;go('pr')">Câu tiếp ➜</button>`}${mathAiBtn('pr_ai','🤖 AI giải thích câu này',`Học sinh trả lời "${S.a}" cho câu: ${q.question}\nĐáp án đúng: ${q.answer}\nHãy giải thích rõ từng bước và chỉ ra lỗi sai nếu có.`)}</div>${aiBoxHtml('pr_ai')}</div>`:''}</div>`};
/* ---------- Test ---------- */
const ga=()=>S.q.map((q,i)=>typ(q)=='mc'?(document.querySelector(`input[name=q${i}]:checked`)||{}).value:($('#q'+i)||{}).value);
